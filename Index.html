<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0e12">
<title>TwoFrame</title>
<style>
:root {
  --bg: #000; --bg2: #141414; --bg3: #222; --line: #262626; --text: #f2f2f2; --dim: #8e8e93;
  --acc: #1fd6ff; --acc2: #ffcf3a; --ok: #4fd1a5; --sel: #fff;
  --video: #1f1f1f; --image: #1f1f1f; --text-c: #b36bff; --shape: #ff8a3d; --solid: #3d8bff; --adjust: #5b6270; --audio: #19b37a;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.4 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
input, textarea { -webkit-user-select: text; user-select: text; }
body { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
.hidden { display: none !important; }
.grow { flex: 1; }
svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---- buttons ---- */
.btn { background: var(--bg3); border: 0; border-radius: 10px; padding: 9px 14px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: #2c2c2c; }
.btn.on { background: #fff; color: #000; }
.btn.primary { background: #fff; color: #000; font-weight: 700; }
.btn.big { padding: 12px 20px; font-size: 16px; }
.btn.wide { width: 100%; margin-bottom: 10px; }
.ib { background: none; border: 0; color: var(--text); width: 40px; height: 40px; display: inline-grid; place-items: center; border-radius: 50%; cursor: pointer; flex: none; }
.ib:disabled { opacity: .3; }
.ib.sm { width: 36px; height: 36px; }
.ib.sm svg { width: 20px; height: 20px; }
.ib.on { color: var(--acc); }
.ib.ghost { width: 32px; height: 32px; color: var(--dim); }
.ib.ghost svg { width: 18px; height: 18px; }
.ib.play { width: 44px; height: 44px; }
.ib.play svg { width: 28px; height: 28px; }
.chip { background: var(--bg3); border: 0; border-radius: 999px; padding: 7px 14px; cursor: pointer; white-space: nowrap; font-size: 14px; }
.chip.on { background: #fff; color: #000; font-weight: 600; }

/* ---- home ---- */
#home { height: 100%; overflow-y: auto; padding: calc(var(--safe-t) + 20px) 16px calc(var(--safe-b) + 24px); }
.homewrap { max-width: 760px; margin: 0 auto; }
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
.brand h1 { margin: 0; font-size: 26px; letter-spacing: -.5px; }
.logo { display: inline-flex; gap: 3px; }
.logo i { width: 11px; height: 22px; border-radius: 3px; background: #fff; }
.logo i + i { background: var(--acc); transform: translateY(5px); }
.newproj { width: 100%; height: 132px; border: 0; border-radius: 18px; background: linear-gradient(135deg, #1c1c1e, #2a2a2e); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; cursor: pointer; font-size: 17px; }
.newproj .plus { width: 46px; height: 46px; border-radius: 50%; background: #fff; color: #000; display: grid; place-items: center; }
.newproj .plus svg { width: 26px; height: 26px; stroke-width: 2.4; }
.homeact { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
.hchip { display: flex; align-items: center; gap: 8px; background: var(--bg2); border: 0; border-radius: 12px; padding: 10px 14px; cursor: pointer; }
.hchip svg { width: 18px; height: 18px; }
.tag { color: var(--dim); }
.note { color: var(--dim); font-size: 13px; }
h2 { font-size: 17px; margin: 26px 0 10px; }
#projectList { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.pcard { position: relative; display: flex; flex-direction: column; gap: 6px; cursor: pointer; }
.pthumb { width: 100%; aspect-ratio: 1 / 1 !important; border-radius: 12px; background: linear-gradient(135deg, #2b2b30, #121214); }
.pinfo { display: flex; flex-direction: column; min-width: 0; }
.pinfo b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
.pinfo span { color: var(--dim); font-size: 12px; }
.pcard .ib { position: absolute; top: 6px; right: 6px; background: #0009; border-radius: 50%; }
.empty { color: var(--dim); }
.presets { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
.preset { background: var(--bg3); border: 2px solid transparent; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
.preset i { display: block; height: 40px; border: 2px solid var(--dim); border-radius: 4px; max-width: 72px; }
.preset small { color: var(--dim); }
.preset.on { border-color: #fff; }
.preset.on i { border-color: #fff; }

/* ---- editor ---- */
#editor { height: 100%; display: flex; flex-direction: column; padding-top: var(--safe-t); background: #000; }
.topbar { height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 10px; flex: none; }
#projName { cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 36vw; font-size: 14px; color: var(--dim); font-weight: 500; }
.reschip { background: var(--bg3); border: 0; border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: 600; cursor: pointer; }
.reschip.on { color: var(--acc); }
.exportbtn { background: #fff; color: #000; border: 0; border-radius: 999px; padding: 8px 18px; font-weight: 700; cursor: pointer; }
.main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.left { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
#stage { flex: 1; min-height: 160px; display: grid; place-items: center; background: #000; position: relative; overflow: hidden; }
#gl { touch-action: none; background: #000; border-radius: 2px; }
#transport { height: 48px; display: flex; align-items: center; gap: 2px; padding: 0 10px; flex: none; }
#timecode { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--dim); min-width: 112px; }
#timecode b { color: #fff; font-weight: 600; }
#timeline { height: 228px; flex: none; position: relative; background: #000; }
#tlScroll { position: absolute; inset: 0; overflow-x: auto; overflow-y: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
#tlScroll::-webkit-scrollbar { display: none; }
#tlInner { position: relative; min-height: 100%; padding-bottom: 12px; }
#ruler { position: sticky; top: 0; height: 26px; z-index: 3; background: #000; }
.tick { position: absolute; top: 4px; transform: translateX(-50%); font-size: 10px; color: #6c6c70; white-space: nowrap; font-variant-numeric: tabular-nums; }
.dot { position: absolute; top: 11px; width: 3px; height: 3px; border-radius: 50%; background: #3a3a3c; transform: translateX(-50%); }
.track { height: 40px; position: relative; margin-bottom: 6px; }
.track.big { height: 56px; }
.clip { position: absolute; top: 0; bottom: 0; border-radius: 6px; background: var(--video); overflow: hidden; display: flex; align-items: center; cursor: pointer; }
.track.big .clip { border-radius: 4px; }
.strip { position: absolute; inset: 0; display: flex; overflow: hidden; pointer-events: none; }
.strip img { height: 100%; object-fit: cover; flex: none; }
.clip .cname { position: relative; font-size: 12px; padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; pointer-events: none; display: flex; align-items: center; gap: 6px; }
.clip .cname i { font-style: normal; opacity: .85; }
.badges { position: absolute; left: 6px; bottom: 4px; display: flex; gap: 4px; pointer-events: none; }
.track:not(.big) .badges { left: auto; right: 22px; bottom: auto; }
.badges em { font-style: normal; font-size: 10px; font-weight: 700; background: #000a; padding: 1px 5px; border-radius: 4px; }
.badges em.hold { background: var(--acc); color: #000; }
.clip.sel { box-shadow: 0 0 0 2px var(--sel); touch-action: none; z-index: 2; }
.clip.off { opacity: .35; }
.clip.t-text { background: var(--text-c); } .clip.t-shape { background: var(--shape); } .clip.t-solid { background: var(--solid); }
.clip.t-adjust { background: var(--adjust); } .clip.t-audio { background: var(--audio); }
.handle { position: absolute; top: 0; bottom: 0; width: 16px; background: #fff; cursor: ew-resize; touch-action: none; z-index: 3; }
.handle.left { left: 0; } .handle.right { right: 0; }
.handle::after { content: ''; position: absolute; left: 7px; top: 35%; bottom: 35%; width: 2px; border-radius: 1px; background: #000; }
.kmark { position: absolute; top: 3px; width: 8px; height: 8px; background: var(--acc2); transform: translateX(-4px) rotate(45deg); pointer-events: none; z-index: 2; }
.tlempty { color: var(--dim); font-size: 13px; padding: 16px 0; }
#playhead { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; margin-left: -1px; background: #fff; z-index: 5; pointer-events: none; box-shadow: 0 0 6px #000; }
#tlAdd { position: absolute; right: 10px; top: 34px; width: 46px; height: 46px; border-radius: 10px; border: 0; background: #fff; color: #000; display: grid; place-items: center; cursor: pointer; z-index: 6; box-shadow: 0 4px 14px #000a; }
#tlAdd svg { width: 26px; height: 26px; stroke-width: 2.4; }

#toolbar { flex: none; display: flex; gap: 2px; overflow-x: auto; padding: 6px 6px calc(var(--safe-b) + 6px); background: #0c0c0c; border-top: 1px solid #1c1c1c; scrollbar-width: none; }
#toolbar::-webkit-scrollbar { display: none; }
.tbtn { flex: none; min-width: 66px; background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px 4px; cursor: pointer; color: #fff; border-radius: 10px; }
.tbtn svg { width: 24px; height: 24px; }
.tbtn span { font-size: 11px; color: #c7c7cc; }
.tbtn.on { background: #1d1d1f; } .tbtn.on span { color: #fff; }
.tbtn.back { min-width: 44px; border-right: 1px solid #222; border-radius: 0; margin-right: 4px; }
.tbtn.danger svg { color: #ff6b6b; }

#sheet { position: relative; flex: none; height: min(46vh, 360px); background: #161616; border-radius: 16px 16px 0 0; z-index: 20; display: flex; flex-direction: column; }
body.sheet-open #timeline { display: none; }
.sheethead { display: flex; align-items: center; justify-content: center; height: 46px; flex: none; position: relative; }
.sheethead b { font-size: 15px; }
.sheethead .ib { position: absolute; right: 8px; top: 5px; color: #fff; }
.sheethead .grab { position: absolute; top: 6px; left: 50%; width: 36px; height: 4px; margin-left: -18px; border-radius: 2px; background: #3a3a3c; }
#panelBody { flex: 1; overflow-y: auto; padding: 2px 14px 16px; -webkit-overflow-scrolling: touch; }

@media (min-width: 900px) {
  .main { flex-direction: row; }
  #timeline { height: 240px; }
  #sheet { position: absolute; right: 0; left: auto; top: 0; bottom: 0; width: 380px; height: auto; border-radius: 0; border-left: 1px solid #222; }
  body.sheet-open #timeline { display: block; }
  .left { padding-right: 0; }
  body.sheet-open .left { padding-right: 380px; }
  .left { flex-direction: column; }
  .main > .left { flex: 1; }
}

/* ---- panel content ---- */
.tools { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin: 6px 0; }
.tool { background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; font-size: 13px; text-align: center; }
.tool:hover { border-color: #3a3f4c; }
.tool.danger { color: #ff7b7b; }
.hint { color: var(--dim); font-size: 13px; }
.warn { color: #ffb4a0; font-size: 13px; background: #ff5a3c18; padding: 8px 10px; border-radius: 8px; }
.row { display: flex; align-items: center; gap: 10px; min-height: 44px; border-bottom: 1px solid #ffffff08; }
.row > span:first-child { flex: 0 0 120px; color: var(--dim); font-size: 14px; }
.row input[type=text], .row input[type=number], .row select { flex: 1; min-width: 0; }
input[type=text], input[type=number], input[type=search], select, textarea { background: var(--bg3); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; }
input[type=search] { width: 100%; margin-bottom: 8px; }
input[type=color] { width: 48px; height: 32px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg3); padding: 2px; }
input[type=range] { flex: 1; min-width: 60px; accent-color: var(--acc); }
.prop { display: flex; align-items: center; gap: 8px; min-height: 44px; border-bottom: 1px solid #ffffff08; flex-wrap: wrap; }
.prop.tall { align-items: flex-start; padding: 6px 0; }
.prop textarea { flex: 1; min-width: 160px; resize: vertical; }
.prop .plabel { flex: 0 0 104px; font-size: 14px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prop input[type=number] { width: 76px; flex: none; }
.prop select { flex: 1; min-width: 0; }
.prop select.ease { flex: none; font-size: 12px; padding: 3px 6px; margin-left: 28px; }
.kbtn { background: none; border: 0; width: 26px; height: 26px; padding: 3px; color: #555b6a; cursor: pointer; flex: none; }
.kbtn svg { width: 18px; height: 18px; }
.kbtn.has { color: var(--acc2); }
.kbtn.on svg { fill: var(--acc2); }
.tog { appearance: none; -webkit-appearance: none; width: 46px; height: 28px; border-radius: 99px; background: #3a3f4c; position: relative; cursor: pointer; flex: none; transition: background .15s; }
.tog::after { content: ''; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; }
.tog:checked { background: var(--acc); }
.tog:checked::after { transform: translateX(18px); }
.tog.sm { width: 38px; height: 22px; } .tog.sm::after { width: 16px; height: 16px; } .tog.sm:checked::after { transform: translateX(16px); }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
.sect { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--acc2); margin: 14px 0 2px; }
.fxcard { border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px 8px; margin-bottom: 10px; background: var(--bg2); }
.fxcard.off { opacity: .55; }
.fxhead { display: flex; align-items: center; gap: 8px; }
.fxhead b { flex: 1; cursor: pointer; padding: 8px 0; }

/* ---- modal ---- */
#modal { position: fixed; inset: 0; background: #000a; z-index: 50; display: grid; grid-template-columns: minmax(0, 1fr); place-items: end center; }
@media (min-width: 700px) { #modal { place-items: center; } }
.mbox { min-width: 0; max-width: 100vw; background: var(--bg2); border: 1px solid var(--line); border-radius: 18px 18px 0 0; width: min(560px, 100%); max-height: 88vh; display: flex; flex-direction: column; padding-bottom: var(--safe-b); }
@media (min-width: 700px) { .mbox { border-radius: 18px; } #modal.big .mbox { width: min(860px, 96vw); } }
.mbox h3 { margin: 0; padding: 16px 18px 6px; }
.mbody { padding: 6px 18px; overflow-y: auto; min-width: 0; }
.fxbrowser { min-width: 0; }
.mact { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 18px 16px; flex-wrap: wrap; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
.fxgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; padding-bottom: 8px; }
.fxitem { text-align: left; background: var(--bg3); border: 1px solid var(--line); border-radius: 12px; padding: 10px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
.fxitem:hover { border-color: var(--acc); }
.fxitem small { color: var(--acc2); font-size: 11px; }
.fxitem span { color: var(--dim); font-size: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.librow { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); padding: 4px 0; }
.librow small { color: var(--dim); }
.bar { height: 10px; border-radius: 99px; background: var(--bg3); overflow: hidden; margin: 10px 0; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--acc), var(--acc2)); transition: width .2s; }
video.result { width: 100%; max-height: 50vh; border-radius: 10px; background: #000; }
.toast { position: fixed; left: 50%; bottom: calc(var(--safe-b) + 24px); transform: translate(-50%, 20px); background: #2b2f3a; padding: 10px 16px; border-radius: 12px; opacity: 0; transition: .25s; z-index: 80; max-width: 90vw; box-shadow: 0 6px 24px #0008; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
#busy { position: fixed; inset: 0; background: #0009; z-index: 70; display: grid; place-items: center; font-size: 16px; }
#videoPool { position: fixed; left: 0; top: 0; width: 2px; height: 2px; overflow: hidden; opacity: 0.01; pointer-events: none; }
#videoPool video { width: 2px; height: 2px; }

</style>
</head>
<body>
<section id="home" class="screen">
  <div class="homewrap">
    <div class="brand"><span class="logo"><i></i><i></i></span><h1>TwoFrame</h1></div>
    <button class="newproj" onclick="UI.newProjectDialog()">
      <span class="plus"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>
      <b>New project</b>
    </button>
    <div class="homeact">
      <button class="hchip" onclick="UI.effectLibrary()"><svg viewBox="0 0 24 24"><path d="M12 2l2.4 6.9H21l-5.4 4.2 2 7L12 16l-5.6 4.1 2-7L3 8.9h6.6z"/></svg>Effects</button>
      <span class="note" id="fxCount"></span>
    </div>
    <h2>Projects</h2>
    <div id="projectList"></div>
  </div>
</section>

<section id="editor" class="screen hidden">
  <header class="topbar">
    <button class="ib" title="Close project" aria-label="Close project" onclick="UI.showHome()"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <b id="projName" onclick="UI.openTool('project')"></b>
    <span class="grow"></span>
    <button class="reschip" id="hqBtn" title="Preview quality" onclick="App.hq=!App.hq;UI.updateTransport();App.requestRender()">720P</button>
    <button class="exportbtn" onclick="UI.exportDialog()">Export</button>
  </header>
  <div class="main">
    <div class="left">
      <div id="stage"><canvas id="gl" width="540" height="960"></canvas></div>
      <div id="transport">
        <span id="timecode"><b>00:00</b> / 00:00</span>
        <span class="grow"></span>
        <button class="ib play" id="playBtn" title="Play" aria-label="Play" onclick="Player.toggle()"></button>
        <span class="grow"></span>
        <button class="ib sm" id="undoBtn" title="Undo" aria-label="Undo" onclick="App.undo()"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
        <button class="ib sm" id="redoBtn" title="Redo" aria-label="Redo" onclick="App.redo()"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
        <button class="ib sm" id="loopBtn" title="Loop" aria-label="Loop" onclick="App.loop=!App.loop;UI.updateTransport()"><svg viewBox="0 0 24 24"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/></svg></button>
      </div>
      <div id="timeline">
        <div id="tlScroll">
          <div id="tlInner">
            <div id="ruler"></div>
            <div id="tracks"></div>
          </div>
        </div>
        <div id="playhead"></div>
        <button id="tlAdd" title="Add media" aria-label="Add media" onclick="document.getElementById('fileMedia').click()"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
      <div id="sheet" class="hidden">
        <div class="sheethead"><span class="grab"></span><b id="sheetTitle"></b><button class="ib sm" title="Done" aria-label="Done" onclick="UI.closeSheet()"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></button></div>
        <div id="panelBody"></div>
      </div>
    </div>
  </div>
  <nav id="toolbar"></nav>
</section>

<div id="modal" class="hidden"></div>
<div id="videoPool" aria-hidden="true"></div>
<input type="file" id="fileMedia" accept="video/*,image/*,audio/*,.mov,.mp4,.m4v,.heic,.mp3,.m4a,.wav" multiple hidden>
<input type="file" id="fileFx" accept=".xml,.zip,text/xml,application/xml,application/zip" multiple hidden>

    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'html') e.innerHTML = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) {
    if (k == null || k === false) continue;
    e.appendChild(typeof k === 'string' || typeof k === 'number' ? document.createTextNode(String(k)) : k);
  }
  return e;
}

function fmtTime(t, fps) {
  t = Math.max(0, t);
  const m = Math.floor(t / 60), s = Math.floor(t % 60), f = Math.floor((t - Math.floor(t)) * fps + 1e-6);
  return `${m}:${String(s).padStart(2, '0')}.${String(f).padStart(2, '0')}`;
}

// "#AARRGGBB" or "#RRGGBB" -> [r,g,b,a] in 0..1
function parseColor(hex) {
  if (Array.isArray(hex)) return hex.slice();
  let h = String(hex || '#ffffff').replace('#', '');
  if (h.length === 6) h = 'FF' + h;
  const n = parseInt(h, 16);
  if (Number.isNaN(n)) return [1, 1, 1, 1];
  return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255, ((n >>> 24) & 255) / 255];
}
function colorToHex(c) {
  const t = (v) => Math.round(clamp(v, 0, 1) * 255).toString(16).padStart(2, '0');
  return '#' + t(c[0]) + t(c[1]) + t(c[2]);
}
function cssColor(c) {
  return `rgba(${Math.round(c[0] * 255)},${Math.round(c[1] * 255)},${Math.round(c[2] * 255)},${c[3] == null ? 1 : c[3]})`;
}

function toast(msg, ms = 2600) {
  const t = el('div', { class: 'toast' }, msg);
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, ms);
}

// ---------------------------------------------------------------------------
// IndexedDB storage. Projects (JSON), media (Blobs) and imported effects (XML).
// Every call is wrapped so the app still runs, without saving, if storage
// is blocked (private browsing, some embedded viewers).
// ---------------------------------------------------------------------------
const Store = {
  db: null,
  ok: false,
  async open() {
    try {
      this.db = await Promise.race([new Promise((_, rej) => setTimeout(() => rej(new Error('storage timeout')), 3000)), new Promise((res, rej) => {
        const r = indexedDB.open('twoframe', 1);
        r.onupgradeneeded = () => {
          const db = r.result;
          for (const s of ['projects', 'media', 'effects']) if (!db.objectStoreNames.contains(s)) db.createObjectStore(s);
        };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      })]);
      this.ok = true;
    } catch (e) {
      console.warn('Storage unavailable', e);
      this.ok = false;
    }
  },
  _tx(store, mode, fn) {
    if (!this.ok) return Promise.resolve(null);
    return new Promise((res) => {
      try {
        const tx = this.db.transaction(store, mode);
        const req = fn(tx.objectStore(store));
        tx.oncomplete = () => res(req ? req.result : null);
        tx.onerror = () => res(null);
        tx.onabort = () => res(null);
      } catch (e) { console.warn(e); res(null); }
    });
  },
  put(store, key, val) { return this._tx(store, 'readwrite', s => s.put(val, key)); },
  get(store, key) { return this._tx(store, 'readonly', s => s.get(key)); },
  del(store, key) { return this._tx(store, 'readwrite', s => s.delete(key)); },
  async all(store) {
    if (!this.ok) return [];
    return new Promise((res) => {
      const out = [];
      try {
        const tx = this.db.transaction(store, 'readonly');
        const c = tx.objectStore(store).openCursor();
        c.onsuccess = () => { const cur = c.result; if (cur) { out.push({ key: cur.key, value: cur.value }); cur.continue(); } };
        tx.oncomplete = () => res(out);
        tx.onerror = () => res(out);
      } catch (e) { res(out); }
    });
  }
};

// ---------------------------------------------------------------------------
// Minimal zip reader, enough for effect packs. Uses the central directory
// and the browser's built-in deflate decoder.
// ---------------------------------------------------------------------------
async function readZip(blob) {
  const buf = new Uint8Array(await blob.arrayBuffer());
  const dv = new DataView(buf.buffer);
  let eocd = -1;
  for (let i = buf.length - 22; i >= Math.max(0, buf.length - 65557); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('Not a zip file');
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const files = [];
  const dec = new TextDecoder();
  for (let n = 0; n < count; n++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true);
    const csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
    const loff = dv.getUint32(p + 42, true);
    const name = dec.decode(buf.subarray(p + 46, p + 46 + nlen));
    p += 46 + nlen + xlen + clen;
    if (name.endsWith('/')) continue;
    const lnlen = dv.getUint16(loff + 26, true), lxlen = dv.getUint16(loff + 28, true);
    const start = loff + 30 + lnlen + lxlen;
    const data = buf.subarray(start, start + csize);
    files.push({
      name,
      async text() {
        if (method === 0) return dec.decode(data);
        if (method !== 8) throw new Error('Unsupported zip compression in ' + name);
        const ds = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
        return await new Response(ds).text();
      }
    });
  }
  return files;
}

// Deterministic hash used by Random Holds (same seed, same result everywhere).
function hash01(seed, i) {
  // 32-bit integer mix (Murmur3 finalizer style)
  let h = (seed * 0x9E3779B1) ^ (i * 0x85EBCA77);
  h = Math.imul(h ^ (h >>> 16), 0x85EBCA6B);
  h = Math.imul(h ^ (h >>> 13), 0xC2B2AE35);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

// ===========================================================================
// Effects: definitions, XML import, built-in library
//
// Every effect is a definition object:
//   { id, name, desc, category, tags, kind: 'shader'|'hold', builtin,
//     params: [{kind, id, label, default, min, max, step, choices}], shader }
//
// The XML format matches Gold Motion / Alight Motion custom effects:
//   <effect id name desc category tags> <params> spinner|color|switch|
//   selector|section|texture </params> <shader> GLSL </shader> </effect>
// so packs written for those apps import directly.
// ===========================================================================

const EffectLib = {
  defs: new Map(),          // id -> def
  order: [],                // display order of ids
  add(def) {
    if (!this.defs.has(def.id)) this.order.push(def.id);
    this.defs.set(def.id, def);
  },
  get(id) { return this.defs.get(id); },
  list() { return this.order.map(id => this.defs.get(id)).filter(Boolean); },
  categories() {
    const cats = [];
    for (const d of this.list()) if (!cats.includes(d.category)) cats.push(d.category);
    return cats;
  }
};

// Category guess for imported effects, from their tags.
const CATEGORY_TAGS = [
  ['Color', ['color', 'grade', 'colour', 'tone', 'lut']],
  ['Blur', ['blur', 'focus', 'sharpen', 'unsharp']],
  ['Distort', ['distort', 'warp', 'ripple', 'twirl', 'mirror', 'kaleido', 'bulge', 'fisheye']],
  ['Glitch', ['glitch', 'digital', 'vhs', 'crt', 'rgb', 'pixel', 'dither', 'scan']],
  ['Light', ['light', 'glow', 'bloom', 'flare', 'ray', 'vignette']],
  ['Stylize', ['stylize', 'art', 'ink', 'comic', 'halftone', 'sketch', 'poster', 'emboss']],
  ['Generate', ['procedural', 'noise', 'plasma', 'fire', 'aurora', 'starfield']],
  ['Retro', ['retro', 'film', 'analog', 'sepia', 'grain', 'super8']],
];

function guessCategory(tags, fallback) {
  const t = (tags || '').toLowerCase();
  for (const [cat, keys] of CATEGORY_TAGS) if (keys.some(k => t.includes(k))) return cat;
  return fallback || 'Custom';
}

// Parse one effect XML file into a definition. Throws with a readable
// message if the file is not a valid effect.
function parseEffectXML(text, sourceName = '') {
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if (doc.querySelector('parsererror')) throw new Error(`${sourceName || 'File'} is not valid XML`);
  const root = doc.documentElement;
  if (!root || root.nodeName !== 'effect') throw new Error(`${sourceName || 'File'} is not an effect (no <effect> root)`);
  const shaderEl = root.querySelector('shader');
  if (!shaderEl) throw new Error(`${sourceName || 'File'} has no <shader>`);

  const params = [];
  const pEl = root.querySelector('params');
  if (pEl) {
    for (const p of Array.from(pEl.children)) {
      const kind = p.nodeName;
      const a = (n, d) => (p.hasAttribute(n) ? p.getAttribute(n) : d);
      if (kind === 'section') params.push({ kind, label: a('text', '') });
      else if (kind === 'texture') params.push({ kind, id: a('id') });
      else if (kind === 'spinner') params.push({
        kind, id: a('id'), label: a('label', a('id')),
        default: parseFloat(a('default', '0')), min: parseFloat(a('min', '0')),
        max: parseFloat(a('max', '1')), step: parseFloat(a('step', '0.01'))
      });
      else if (kind === 'color') params.push({ kind, id: a('id'), label: a('label', a('id')), default: parseColor(a('default', '#FFFFFFFF')) });
      else if (kind === 'switch') params.push({ kind, id: a('id'), label: a('label', a('id')), default: a('default', 'false') === 'true' });
      else if (kind === 'selector') params.push({
        kind, id: a('id'), label: a('label', a('id')), default: parseInt(a('default', '0'), 10) || 0,
        choices: Array.from(p.querySelectorAll('choice')).map(c => ({ value: parseInt(c.getAttribute('value'), 10) || 0, label: c.getAttribute('label') || '' }))
      });
    }
  }
  const tags = root.getAttribute('tags') || '';
  const rawCat = root.getAttribute('category') || '';
  const def = {
    id: root.getAttribute('id') || ('custom.' + uid()),
    name: root.getAttribute('name') || sourceName || 'Custom Effect',
    desc: root.getAttribute('desc') || '',
    category: rawCat && rawCat !== 'custom' ? rawCat : guessCategory(tags, 'Custom'),
    tags,
    kind: 'shader',
    builtin: false,
    precision: shaderEl.getAttribute('precision') || 'high',
    params,
    shader: shaderEl.textContent || '',
    xml: text
  };
  if (!params.some(p => p.kind === 'texture')) params.unshift({ kind: 'texture', id: 'inputImg' });
  return def;
}

// Default parameter values for a new effect instance.
function defaultParams(def) {
  const out = {};
  for (const p of def.params) if (p.id && p.kind !== 'texture' && p.kind !== 'section') out[p.id] = deepCopy(p.default);
  return out;
}

// ---------------------------------------------------------------------------
// Built-in library. Written in the same structure as imported effects.
// ---------------------------------------------------------------------------
const S = (id, label, d, min, max, step = 0.01) => ({ kind: 'spinner', id, label, default: d, min, max, step });
const C = (id, label, hex) => ({ kind: 'color', id, label, default: parseColor(hex) });
const B = (id, label, d = false) => ({ kind: 'switch', id, label, default: d });
const L = (id, label, d, labels) => ({ kind: 'selector', id, label, default: d, choices: labels.map((l, i) => ({ value: i, label: l })) });
const H = (label) => ({ kind: 'section', label });

// Helpers available to every built-in shader.
const TF_PRELUDE = `
float tfLum(vec3 c){ return dot(c, vec3(0.2126, 0.7152, 0.0722)); }
float tfHash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }
float tfNoise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.0-2.0*f);
  return mix(mix(tfHash(i), tfHash(i+vec2(1.0,0.0)), u.x), mix(tfHash(i+vec2(0.0,1.0)), tfHash(i+vec2(1.0,1.0)), u.x), u.y); }
vec4 tfGet(vec2 uv){ return texture2DCv(inputImg.texture, uv); }
vec4 tfGetT(vec2 uv){ if (uv.x < 0.0 || uv.y < 0.0 || uv.x > 1.0 || uv.y > 1.0) return vec4(0.0); return texture2DCv(inputImg.texture, uv); }
vec3 tfUn(vec4 c){ return c.rgb / max(c.a, 1e-4); }
float tfK(){ return acScreenSize.y / 1080.0; }
`;

function fx(id, name, category, desc, params, body) {
  EffectLib.add({
    id: 'tf.' + id, name, category, desc, tags: category.toLowerCase(), kind: 'shader', builtin: true,
    precision: 'high', params: [{ kind: 'texture', id: 'inputImg' }, ...params], shader: TF_PRELUDE + body
  });
}

fx('brightcon', 'Brightness & Contrast', 'Color', 'Basic brightness and contrast.',
  [S('brightness', 'Brightness', 0, -1, 1), S('contrast', 'Contrast', 1, 0, 3)], `
void main(){ vec4 s = tfGet(acScreenNorm); vec3 c = tfUn(s);
  c = (c - 0.5) * contrast + 0.5 + brightness;
  gl_FragColor = vec4(clamp(c,0.0,1.0) * s.a, s.a); }`);

fx('huesat', 'Hue / Saturation', 'Color', 'Rotate hue, change saturation and lightness.',
  [S('hue', 'Hue', 0, -180, 180, 1), S('saturation', 'Saturation', 1, 0, 3), S('lightness', 'Lightness', 0, -1, 1)], `
void main(){ vec4 s = tfGet(acScreenNorm); vec3 c = tfUn(s);
  float a = radians(hue); float cs = cos(a), sn = sin(a);
  mat3 m = mat3(0.299,0.587,0.114, 0.299,0.587,0.114, 0.299,0.587,0.114)
    + mat3(0.701,-0.587,-0.114, -0.299,0.413,-0.114, -0.300,-0.588,0.886) * cs
    + mat3(0.168,0.330,-0.497, -0.328,0.035,0.292, 1.250,-1.050,-0.203) * sn;
  c = c * m;
  float l = tfLum(c); c = mix(vec3(l), c, saturation);
  c = lightness >= 0.0 ? mix(c, vec3(1.0), lightness) : c * (1.0 + lightness);
  gl_FragColor = vec4(clamp(c,0.0,1.0) * s.a, s.a); }`);

fx('exposure', 'Exposure', 'Color', 'Exposure in stops, gamma and offset.',

  c = c * exp2(exposure) + offsetV; c = pow(max(c, 0.0), vec3(1.0 / gamma));
  gl_FragColor = vec4(clamp(c,0.0,1.0) * s.a, s.a); }`);

fx('vibrance', 'Vibrance', 'Color', 'Boosts muted colors more than strong ones.',

  float mx = max(c.r, max(c.g, c.b)), mn = min(c.r, min(c.g, c.b)); float sat = mx - mn;
  float l = tfLum(c); c = mix(vec3(l), c, 1.0 + vibrance * (1.0 - sat));

fx('bw', 'Black & White', 'Color', 'Converts to grayscale with adjustable channel mix.',

  float g = dot(c, vec3(rw, gw, bw)) / max(rw + gw + bw, 0.01);

fx('tint', 'Tint', 'Color', 'Maps shadows and highlights to two colors.',

fx('colorbal', 'Color Balance', 'Color', 'Pushes shadows, midtones and highlights toward colors.',
  [C('shadows', 'Shadows', '#FF0A2040'), C('mids', 'Midtones', '#FF808080'), C('highs', 'Highlights', '#FFFFE0B0'), S('amount', 'Amount', 0.5, 0, 1)], `
void main(){ vec4 s = tfGet(acScreenNorm); vec3 c = tfUn(s); float l = tfLum(c);

fx('blur', 'Gaussian Blur', 'Blur', 'Soft blur in all directions.',
  [S('radius', 'Radius', 12, 0, 120, 0.5)], `
void main(){ vec2 uv = acScreenNorm; vec2 px = 1.0 / acScreenSize; float r = radius * tfK();
  if (r < 0.5) { gl_FragColor = tfGet(uv); return; }
  vec4 acc = vec4(0.0); float wsum = 0.0;
  for (int i = 0; i < 64; i++) { float fi = float(i); float rr = sqrt((fi + 0.5) / 64.0);
    float th = fi * 2.39996; vec2 o = vec2(cos(th), sin(th)) * rr * r;
    float w = exp(-rr * rr * 2.0); acc += tfGet(uv + o * px) * w; wsum += w; }
  gl_FragColor = acc / wsum; }`);

fx('spinblur', 'Spin Blur', 'Blur', 'Blurs in a circle around a center point.',

  vec2 p = (uv - vec2(cx, cy)) * asp; vec4 acc = vec4(0.0);
  for (int i = 0; i < 40; i++) { float a = radians(angle) * (float(i) / 39.0 - 0.5); float cs = cos(a), sn = sin(a);
    vec2 q = vec2(p.x * cs - p.y * sn, p.x * sn + p.y * cs); acc += tfGet(q / asp + vec2(cx, cy)); }
  gl_FragColor = acc / 40.0; }`);

fx('sharpen', 'Sharpen', 'Blur', 'Crisps up edges.',

  vec4 b = (tfGet(uv + vec2(px.x,0.0)) + tfGet(uv - vec2(px.x,0.0)) + tfGet(uv + vec2(0.0,px.y)) + tfGet(uv - vec2(0.0,px.y))) * 0.25;

fx('glow', 'Glow', 'Light', 'Makes bright areas glow.',
  [S('threshold', 'Threshold', 0.6, 0, 1), S('radius', 'Radius', 24, 1, 150, 0.5), S('intensity', 'Intensity', 1.2, 0, 5), C('tintC', 'Glow Color', '#FFFFFFFF')], `
void main(){ vec2 uv = acScreenNorm; vec2 px = 1.0 / acScreenSize; float r = radius * tfK();
  vec4 s = tfGet(uv); vec3 acc = vec3(0.0); float asum = 0.0; float wsum = 0.0;
  for (int i = 0; i < 48; i++) { float fi = float(i); float rr = sqrt((fi + 0.5) / 48.0); float th = fi * 2.39996;
    vec4 c = tfGet(uv + vec2(cos(th), sin(th)) * rr * r * px); float w = exp(-rr * rr * 3.0);
    float k = smoothstep(threshold, threshold + 0.15, tfLum(tfUn(c))) * c.a;
    acc += tfUn(c) * k * w; asum += k * w; wsum += w; }
  vec3 g = acc / wsum * intensity * tintC.rgb; float ga = clamp(asum / wsum * intensity, 0.0, 1.0);
  gl_FragColor = vec4(s.rgb + g * (1.0 - s.a * 0.0), max(s.a, ga)); gl_FragColor.rgb = min(gl_FragColor.rgb, vec3(gl_FragColor.a) * 4.0); }`);

fx('vignette', 'Vignette', 'Light', 'Darkens the edges of the frame.',

  float v = smoothstep(size, size + soft, length(d) * 1.2) * amount;
  gl_FragColor = vec4(mix(s.rgb, vcolor.rgb * s.a, v), s.a); }`);

fx('lightleak', 'Light Leak', 'Light', 'Warm drifting light washes, like old film.',
  [S('amount', 'Amount', 0.6, 0, 1), S('speed', 'Speed', 0.3, 0, 3), C('c1', 'Color 1', '#FFFF7A2E'), C('c2', 'Color 2', '#FFFF2E8A'), S('seed', 'Seed', 1, 0, 100, 1)], `
void main(){ vec2 uv = acScreenNorm; vec4 s = tfGet(uv); float t = acTime * speed + seed * 7.13;
  vec2 p1 = vec2(0.15 + 0.3 * sin(t * 0.7), 0.3 + 0.25 * cos(t * 0.5)); vec2 p2 = vec2(0.85 + 0.2 * cos(t * 0.6), 0.7 + 0.3 * sin(t * 0.4));
  float a = exp(-dot(uv - p1, uv - p1) * 6.0), b = exp(-dot(uv - p2, uv - p2) * 5.0);
  vec3 l = (c1.rgb * a + c2.rgb * b) * amount * (0.75 + 0.25 * tfNoise(vec2(t * 3.0, 0.0)));
  gl_FragColor = vec4(s.rgb + l * (1.0 - s.rgb / max(s.a, 1e-4)) * s.a + l * (1.0 - s.a) * 0.0, s.a); }`);

fx('rays', 'Light Rays', 'Light', 'Streaks of light from bright areas toward the viewer.',

  for (int i = 0; i < 48; i++) { float t = float(i) / 47.0; vec4 q = tfGet(uv + (c - uv) * t * len);

  float bl = tfLum(tfGet(uv + px * vec2(-1.0,1.0)).rgb), b = tfLum(tfGet(uv + px * vec2(0.0,1.0)).rgb), br = tfLum(tfGet(uv + px * vec2(1.0,1.0)).rgb);
  float gx = -tl - 2.0*l - bl + tr + 2.0*r + br, gy = -tl - 2.0*t - tr + bl + 2.0*b + br;

fx('oldfilm', 'Old Film', 'Retro', 'Sepia, flicker, dust and scratches.',

  vec4 s = tfGet(uv); vec3 c = tfUn(s); float l = tfLum(c); vec3 sep = vec3(l * 1.07, l * 0.92, l * 0.72);
  c = mix(c, sep, amount); c *= 1.0 - flicker * tfHash(vec2(t, 9.0)) * amount;
  float sx = tfHash(vec2(t, 1.0)); float scratch = (1.0 - smoothstep(0.0, 0.0015, abs(uv.x - sx))) * step(0.6, tfHash(vec2(t, 5.0)));
  float sp = step(1.0 - 0.0015 * dust, tfHash(floor(uv * acScreenSize / 3.0) + t)); c = mix(c, vec3(0.1), (scratch * 0.5 + sp) * amount);
  vec2 d = uv - 0.5; c *= 1.0 - dot(d, d) * 0.9 * amount; gl_FragColor = vec4(clamp(c,0.0,1.0) * s.a, s.a); }`);

  [L('mode', 'Mode', 0, ['Left onto Right', 'Right onto Left', 'Top onto Bottom', 'Bottom onto Top', 'Four-way'])], `
void main(){ vec2 uv = acScreenNorm;
  if (mode == 0) uv.x = uv.x > 0.5 ? 1.0 - uv.x : uv.x;
  else if (mode == 1) uv.x = uv.x < 0.5 ? 1.0 - uv.x : uv.x;
  else if (mode == 2) uv.y = uv.y > 0.5 ? 1.0 - uv.y : uv.y;
  else if (mode == 3) uv.y = uv.y < 0.5 ? 1.0 - uv.y : uv.y;

  float a = atan(d.y, d.x) + radians(rotation); float seg = 6.28318 / segments; a = mod(a, seg); a = abs(a - seg * 0.5);

  float n = 0.0, a = 0.5; for (int i = 0; i < 5; i++) { n += a * tfNoise(p + t); p = p * 2.03 + 11.7; a *= 0.5; }

  if (place == 0) gl_FragColor = s + nc * (1.0 - s.a); else if (place == 1) gl_FragColor = vec4(mix(s.rgb, nc.rgb * s.a, 0.5), s.a); else gl_FragColor = nc; }`);

// ===========================================================================
// Engine: WebGL2 rendering
//
// Conventions used everywhere inside the engine:
//   * Colors are premultiplied by alpha.
//   * Texture coordinate v = 0 is the TOP row of an image. Comp pixel
//     coordinates run x right, y down, with (0,0) at the top left.
//   * Only the final present() flips the image for the screen.
// Effect shaders use GLSL ES 1.0 (gl_FragColor, texture2D), which is what
// Gold Motion / Alight Motion XML effects are written in.
// ===========================================================================

const VS_FULL = `
attribute vec2 aPos; varying vec2 vUv;
void main(){ vUv = aPos; gl_Position = vec4(aPos * 2.0 - 1.0, 0.0, 1.0); }`;

const VS_LAYER = `
attribute vec2 aPos; uniform mat3 uM; varying vec2 vUv;
void main(){ vUv = aPos; vec3 p = uM * vec3(aPos, 1.0); gl_Position = vec4(p.xy, 0.0, 1.0); }`;

const FS_HEAD = 'precision highp float;\nprecision highp int;\nvarying vec2 vUv;\n';

const FS_COPY = FS_HEAD + `uniform sampler2D uTex; uniform float uOp;
void main(){ gl_FragColor = texture2D(uTex, vUv) * uOp; }`;

const FS_SOLID = FS_HEAD + `uniform vec4 uColor;
void main(){ gl_FragColor = vec4(uColor.rgb * uColor.a, uColor.a); }`;

const FS_PRESENT = FS_HEAD + `uniform sampler2D uTex;
void main(){ vec4 c = texture2D(uTex, vec2(vUv.x, 1.0 - vUv.y)); gl_FragColor = vec4(c.rgb, 1.0); }`;

const FS_MIX = FS_HEAD + `uniform sampler2D uA; uniform sampler2D uB; uniform float uT;
void main(){ gl_FragColor = mix(texture2D(uA, vUv), texture2D(uB, vUv), uT); }`;

// Layer blending. Modes: 0 Normal 1 Add 2 Screen 3 Multiply 4 Overlay
// 5 Lighten 6 Darken 7 Difference. uTint multiplies the source color
// (used for ghost tint), uOp fades it.
const FS_COMPOSITE = FS_HEAD + `uniform sampler2D uDst; uniform sampler2D uSrc; uniform float uOp; uniform int uMode; uniform vec3 uTint;
void main(){
  vec4 d = texture2D(uDst, vUv); vec4 s = texture2D(uSrc, vUv); s.rgb *= uTint; s *= uOp;
  if (uMode == 0) { gl_FragColor = s + d * (1.0 - s.a); return; }
  float a = s.a + d.a - s.a * d.a;
  if (uMode == 1) { gl_FragColor = vec4(min(s.rgb + d.rgb, vec3(a)), a); return; }
  vec3 cs = s.rgb / max(s.a, 1e-4); vec3 cd = d.rgb / max(d.a, 1e-4); vec3 b;
  if (uMode == 2) b = cs + cd - cs * cd;
  else if (uMode == 3) b = cs * cd;
  else if (uMode == 4) b = mix(2.0 * cs * cd, 1.0 - 2.0 * (1.0 - cs) * (1.0 - cd), step(0.5, cd));
  else if (uMode == 5) b = max(cs, cd);
  else if (uMode == 6) b = min(cs, cd);
  else b = abs(cs - cd);
  gl_FragColor = vec4(s.rgb * (1.0 - d.a) + d.rgb * (1.0 - s.a) + s.a * d.a * b, a);

// Snap Blur: averages samples trailing back along uDir (in uv units).
const FS_DIRBLUR = FS_HEAD + `uniform sampler2D uTex; uniform vec2 uDir; uniform float uTaps;
void main(){ vec4 acc = vec4(0.0); for (int i = 0; i < 48; i++) { if (float(i) >= uTaps) break;
  float t = float(i) / max(uTaps - 1.0, 1.0); acc += texture2D(uTex, vUv - uDir * t); }
  gl_FragColor = acc / uTaps; }`;

// ---- Optical flow (pyramidal Lucas-Kanade) -------------------------------
// Gray + gradient: r = dI/dx, g = dI/dy, b = I.
const FS_FLOW_GRAY = FS_HEAD + `uniform sampler2D uTex; uniform vec2 uPx;
float L(vec2 p){ vec4 c = texture2D(uTex, p); return dot(c.rgb, vec3(0.299, 0.587, 0.114)); }
void main(){ float l = (L(vUv + uPx * vec2(-0.25,-0.25)) + L(vUv + uPx * vec2(0.25,-0.25)) + L(vUv + uPx * vec2(-0.25,0.25)) + L(vUv + uPx * vec2(0.25,0.25))) * 0.25;
  gl_FragColor = vec4(l, l, l, 1.0); }`;
const FS_FLOW_GRAD = FS_HEAD + `uniform sampler2D uTex; uniform vec2 uPx;
void main(){ float c = texture2D(uTex, vUv).b;
  float gx = (texture2D(uTex, vUv + vec2(uPx.x, 0.0)).b - texture2D(uTex, vUv - vec2(uPx.x, 0.0)).b) * 0.5;
  float gy = (texture2D(uTex, vUv + vec2(0.0, uPx.y)).b - texture2D(uTex, vUv - vec2(0.0, uPx.y)).b) * 0.5;
  gl_FragColor = vec4(gx, gy, c, 1.0); }`;
// One LK refinement. uFlow holds flow in texels of this level (rg).
const FS_FLOW_LK = FS_HEAD + `uniform sampler2D uGradA; uniform sampler2D uB; uniform sampler2D uFlow; uniform vec2 uPx;
void main(){ vec2 f = texture2D(uFlow, vUv).rg; float g00 = 1e-4, g01 = 0.0, g11 = 1e-4, b0 = 0.0, b1 = 0.0;
  for (int j = -2; j <= 2; j++) for (int i = -2; i <= 2; i++) {
    vec2 o = vec2(float(i), float(j)) * uPx; vec3 ga = texture2D(uGradA, vUv + o).rgb;
    float ib = texture2D(uB, vUv + o + f * uPx).b; float it = ib - ga.b; float w = 1.0 / (1.0 + float(i*i + j*j) * 0.25);
    g00 += ga.r * ga.r * w; g01 += ga.r * ga.g * w; g11 += ga.g * ga.g * w; b0 += ga.r * it * w; b1 += ga.g * it * w; }

  if (abs(det) > 1e-9) d = -vec2(g11 * b0 - g01 * b1, -g01 * b0 + g00 * b1) / det;
  d = clamp(d, vec2(-2.0), vec2(2.0)); gl_FragColor = vec4(f + d, 0.0, 1.0); }`;
const FS_FLOW_SMOOTH = FS_HEAD + `uniform sampler2D uFlow; uniform vec2 uPx;
void main(){ vec2 c = texture2D(uFlow, vUv).rg * 4.0 + texture2D(uFlow, vUv + vec2(uPx.x,0.0)).rg + texture2D(uFlow, vUv - vec2(uPx.x,0.0)).rg
  + texture2D(uFlow, vUv + vec2(0.0,uPx.y)).rg + texture2D(uFlow, vUv - vec2(0.0,uPx.y)).rg; gl_FragColor = vec4(c / 8.0, 0.0, 1.0); }`;
const FS_FLOW_UP = FS_HEAD + `uniform sampler2D uFlow; void main(){ gl_FragColor = vec4(texture2D(uFlow, vUv).rg * 2.0, 0.0, 1.0); }`;
// Final in-between frame. uFlowPx converts flow texels to uv.
const FS_FLOW_WARP = FS_HEAD + `uniform sampler2D uA; uniform sampler2D uB; uniform sampler2D uFlow; uniform vec2 uFlowPx; uniform float uT;
void main(){ vec2 f = texture2D(uFlow, vUv).rg * uFlowPx;
  vec4 a = texture2D(uA, vUv - f * uT); vec4 b = texture2D(uB, vUv + f * (1.0 - uT));
  gl_FragColor = mix(a, b, uT); }`;

// Repairs for shaders written against lenient mobile drivers:
//  * words reserved in GLSL ES used as variable names (flat, sample...)
//  * float(INT * 4.0) style mixed int/float arithmetic inside float()
function repairShader(src) {
  const reserved = ['flat', 'smooth', 'sample', 'input', 'output', 'filter', 'active', 'common', 'partition', 'superp', 'noperspective', 'centroid', 'patch', 'resource', 'buffer', 'shared', 'coherent', 'packed'];
  let out = src;
  for (const w of reserved) out = out.replace(new RegExp('\\b' + w + '\\b', 'g'), w + '_v');
  out = out.replace(/float\(\s*([A-Za-z_]\w*)\s*\*\s*(\d+\.\d*)\s*\)/g, '(float($1) * $2)');
  out = out.replace(/float\(\s*(\d+\.\d*)\s*\*\s*([A-Za-z_]\w*)\s*\)/g, '($1 * float($2))');
  return out;
}

class Engine {
  constructor(canvas) {
    this.canvas = canvas;
    const gl = canvas.getContext('webgl2', { premultipliedAlpha: true, alpha: false, preserveDrawingBuffer: true, antialias: false, powerPreference: 'high-performance' });
    if (!gl) throw new Error('This browser does not support WebGL2.');
    this.gl = gl;
    this.floatRT = !!gl.getExtension('EXT_color_buffer_float');
    gl.getExtension('OES_texture_float_linear');
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.disable(gl.DEPTH_TEST);
    gl.disable(gl.BLEND);

    this.quad = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.quad);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0, 1, 0, 0, 1, 0, 1, 1, 0, 1, 1]), gl.STATIC_DRAW);

    this.programs = new Map();
    this.effectErrors = new Map();
    this.rts = new Map();
    this.pool = [];
    this.uploadTex = this.newTex();
    this.width = canvas.width; this.height = canvas.height;
    this.compW = canvas.width; this.compH = canvas.height;

    this.pCopy = this.program('copy', VS_FULL, FS_COPY);
    this.pLayer = this.program('layer', VS_LAYER, FS_COPY);
    this.pSolid = this.program('solid', VS_LAYER, FS_SOLID);
    this.pPresent = this.program('present', VS_FULL, FS_PRESENT);
    this.pMix = this.program('mix', VS_FULL, FS_MIX);
    this.pComp = this.program('comp', VS_FULL, FS_COMPOSITE);
    this.pDirBlur = this.program('dirblur', VS_FULL, FS_DIRBLUR);
    this.pGray = this.program('fgray', VS_FULL, FS_FLOW_GRAY);
    this.pGrad = this.program('fgrad', VS_FULL, FS_FLOW_GRAD);
    this.pLK = this.program('flk', VS_FULL, FS_FLOW_LK);
    this.pSmooth = this.program('fsmooth', VS_FULL, FS_FLOW_SMOOTH);
    this.pUp = this.program('fup', VS_FULL, FS_FLOW_UP);
    this.pWarp = this.program('fwarp', VS_FULL, FS_FLOW_WARP);
  }

  // ---- size --------------------------------------------------------------
  setSize(renderW, renderH, compW, compH) {
    renderW = Math.max(2, Math.round(renderW)); renderH = Math.max(2, Math.round(renderH));
    if (this.canvas.width !== renderW || this.canvas.height !== renderH) {
      this.canvas.width = renderW; this.canvas.height = renderH;
    }
    if (renderW !== this.width || renderH !== this.height) {
      for (const [k, rt] of this.rts) if (rt.compSized) { this.freeRT(rt); this.rts.delete(k); }
    }
    this.width = renderW; this.height = renderH; this.compW = compW; this.compH = compH;
  }

  // ---- programs ----------------------------------------------------------
  compile(type, src) {
    const gl = this.gl, sh = gl.createShader(type);
    gl.shaderSource(sh, src); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(sh); gl.deleteShader(sh); throw new Error(log || 'Shader failed to compile');
    }
    return sh;
  }
  program(key, vs, fs) {
    if (this.programs.has(key)) return this.programs.get(key);
    const gl = this.gl;
    const p = gl.createProgram();
    gl.attachShader(p, this.compile(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, this.compile(gl.FRAGMENT_SHADER, fs));
    gl.bindAttribLocation(p, 0, 'aPos');
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p) || 'Link failed');
    const uniforms = {};
    const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) {
      const info = gl.getActiveUniform(p, i);
      uniforms[info.name] = { loc: gl.getUniformLocation(p, info.name), type: info.type };
    }
    const prog = { p, uniforms };
    this.programs.set(key, prog);
    return prog;
  }

  // Builds a full fragment shader from an effect definition.
  effectSource(def) {
    const prec = def.precision === 'medium' || def.precision === 'mediump' ? 'mediump' : 'highp';
    let src = def.shader.replace(/#version[^\n]*\n/g, '').replace(/^\s*precision\s+\w+\s+(float|int)\s*;/gm, '');
    let decl = `precision ${prec} float;\nprecision highp int;\nvarying vec2 vUv;\nuniform vec2 acScreenSize;\nuniform float acTime;\n#define acScreenNorm vUv\n#define texture2DCv texture2D\n`;
    const declared = (id) => new RegExp('uniform\\s+\\w+\\s+' + id + '\\s*;').test(src);
    for (const p of def.params) {
      if (!p.id) continue;
      if (p.kind === 'texture') {
        src = src.replace(new RegExp('\\b' + p.id + '\\.texture\\b', 'g'), p.id + '_t');
        decl += `uniform sampler2D ${p.id}_t;\n`;
      } else if (!declared(p.id)) {
        if (p.kind === 'spinner') decl += `uniform float ${p.id};\n`;
        else if (p.kind === 'color') decl += `uniform vec4 ${p.id};\n`;
        else if (p.kind === 'switch') decl += `uniform bool ${p.id};\n`;
        else if (p.kind === 'selector') decl += `uniform int ${p.id};\n`;
      }
    }
    return decl + src;
  }

  effectProgram(def) {
    const key = 'fx:' + def.id + ':' + def.shader.length;
    if (this.programs.has(key)) return this.programs.get(key);
    if (this.effectErrors.has(key)) return null;
    try {
      return this.program(key, VS_FULL, this.effectSource(def));
    } catch (e) {
      // Some phone GPU drivers accept loose GLSL that browsers reject.
      // Retry once with common repairs before giving up.
      const fixed = repairShader(def.shader);
      if (fixed !== def.shader) {
        try {
          const prog = this.program(key, VS_FULL, this.effectSource({ ...def, shader: fixed }));
          def.repaired = true;
          return prog;
        } catch (e2) { /* fall through */ }
      }
      console.warn('Effect failed to compile:', def.name, e.message);
      this.effectErrors.set(key, e.message);
      return null;
    }
  }
  effectError(def) { return this.effectErrors.get('fx:' + def.id + ':' + def.shader.length) || null; }

  // ---- textures and render targets ----------------------------------------
  newTex(filter) {
    const gl = this.gl, t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter || gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter || gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return t;
  }
  makeRT(w, h, float) {
    const gl = this.gl;
    w = Math.max(1, Math.round(w)); h = Math.max(1, Math.round(h));
    const useFloat = float && this.floatRT;
    const i = this.pool.findIndex(r => r.w === w && r.h === h && r.float === useFloat);
    if (i >= 0) return this.pool.splice(i, 1)[0];
    const tex = this.newTex();
    if (useFloat) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
    else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    const fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    return { tex, fb, w, h, float: useFloat };
  }
  freeRT(rt) {
    if (!rt) return;
    this.pool.push(rt);
    while (this.pool.length > 24) {
      const r = this.pool.shift();
      this.gl.deleteTexture(r.tex); this.gl.deleteFramebuffer(r.fb);
    }
  }
  // Named render target, created on first use. compSized ones follow the render size.
  rt(name, w, h, float) {
    const cs = w == null;
    if (cs) { w = this.width; h = this.height; }
    let r = this.rts.get(name);
    if (r && (r.w !== Math.round(w) || r.h !== Math.round(h) || (!!float && this.floatRT) !== r.float)) { this.freeRT(r); r = null; }
    if (!r) { r = this.makeRT(w, h, float); r.compSized = cs; this.rts.set(name, r); }
    return r;

  upload(tex, source) {
    const gl = this.gl;
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
  }

  // ---- drawing -----------------------------------------------------------
  setUniforms(prog, uniforms) {
    const gl = this.gl;
    let unit = 0;
    for (const [name, v] of Object.entries(uniforms)) {
      const u = prog.uniforms[name];
      if (!u) continue;
      switch (u.type) {
        case gl.SAMPLER_2D:
          gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, v && v.tex ? v.tex : v);
          gl.uniform1i(u.loc, unit); unit++; break;
        case gl.FLOAT: gl.uniform1f(u.loc, +v || 0); break;
        case gl.FLOAT_VEC2: gl.uniform2fv(u.loc, v); break;
        case gl.FLOAT_VEC3: gl.uniform3fv(u.loc, v); break;
        case gl.FLOAT_VEC4: gl.uniform4fv(u.loc, v); break;
        case gl.INT: gl.uniform1i(u.loc, Math.round(+v || 0)); break;
        case gl.BOOL: gl.uniform1i(u.loc, v ? 1 : 0); break;
        case gl.FLOAT_MAT3: gl.uniformMatrix3fv(u.loc, false, v); break;
      }
    }
  }
  bindTarget(target) {
    const gl = this.gl;
    if (target) { gl.bindFramebuffer(gl.FRAMEBUFFER, target.fb); gl.viewport(0, 0, target.w, target.h); }
    else { gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, this.canvas.width, this.canvas.height); }
  }
  clear(target, rgba = [0, 0, 0, 0]) {
    const gl = this.gl;
    this.bindTarget(target);
    gl.clearColor(rgba[0] * rgba[3], rgba[1] * rgba[3], rgba[2] * rgba[3], rgba[3]);
    gl.clear(gl.COLOR_BUFFER_BIT);
  }
  draw(prog, target, uniforms, blendOver = false) {
    const gl = this.gl;
    this.bindTarget(target);
    gl.useProgram(prog.p);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.quad);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    this.setUniforms(prog, uniforms);
    if (blendOver) { gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA); }
    gl.drawArrays(gl.TRIANGLES, 0, 6);
    if (blendOver) gl.disable(gl.BLEND);
  }

  // Matrix that places content of size cw x ch (comp px) with a transform.
  layerMatrix(cw, ch, tr) {
    const W = this.compW, H = this.compH;
    const s = (tr.scale ?? 100) / 100, sx = s * (tr.flipX ? -1 : 1), sy = s;
    const th = (tr.rotation || 0) * Math.PI / 180, c = Math.cos(th), n = Math.sin(th);
    const ax = cw / 2 + (tr.anchorX || 0), ay = ch / 2 + (tr.anchorY || 0);
    const a00 = c * sx * cw, a01 = -n * sy * ch, a10 = n * sx * cw, a11 = c * sy * ch;
    const tx = (tr.x ?? W / 2) - c * sx * ax + n * sy * ay;
    const ty = (tr.y ?? H / 2) - n * sx * ax - c * sy * ay;
    return new Float32Array([2 / W * a00, 2 / H * a10, 0, 2 / W * a01, 2 / H * a11, 0, 2 / W * tx - 1, 2 / H * ty - 1, 1]);
  }
  drawLayerTex(tex, cw, ch, tr, target) {
    this.draw(this.pLayer, target, { uM: this.layerMatrix(cw, ch, tr), uTex: tex, uOp: 1 }, true);
  }
  drawSolid(color, cw, ch, tr, target) {
    this.draw(this.pSolid, target, { uM: this.layerMatrix(cw, ch, tr), uColor: color }, true);
  }
  copy(src, target, op = 1) { this.draw(this.pCopy, target, { uTex: src, uOp: op }); }
  mix(a, b, t, target) { this.draw(this.pMix, target, { uA: a, uB: b, uT: t }); }
  composite(dst, src, mode, opacity, target, tint = [1, 1, 1]) {
    this.draw(this.pComp, target, { uDst: dst, uSrc: src, uOp: opacity, uMode: mode, uTint: tint });
  }
  dirBlur(src, dirUV, taps, target) { this.draw(this.pDirBlur, target, { uTex: src, uDir: dirUV, uTaps: taps }); }
  present(src) { this.draw(this.pPresent, null, { uTex: src }); }

  // Run one effect: input texture -> target.
  runEffect(def, values, input, target, time) {
    const prog = this.effectProgram(def);
    if (!prog) { this.copy(input, target); return false; }
    const u = { acScreenSize: [target.w, target.h], acTime: time };
    for (const p of def.params) {
      if (!p.id) continue;
      if (p.kind === 'texture') u[p.id + '_t'] = input;
      else if (p.kind === 'section') continue;
      else u[p.id] = values[p.id] ?? p.default;
    }
    this.draw(prog, target, u);
    return true;
  }

  // Small readback for Snap Blur: returns centroid info of a texture.
  centroid(src) {
    const gl = this.gl, w = 64, h = 36;
    const small = this.rt('centroid', w, h);
    this.copy(src, small);
    const px = new Uint8Array(w * h * 4);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
    let sa = 0, sax = 0, say = 0, sl = 0, slx = 0, sly = 0;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4, a = px[i + 3] / 255, l = (px[i] * 0.2126 + px[i + 1] * 0.7152 + px[i + 2] * 0.0722) / 255;
      const u = (x + 0.5) / w, v = (y + 0.5) / h;
      sa += a; sax += a * u; say += a * v; sl += l; slx += l * u; sly += l * v;
    }
    return { a: sa, ax: sa ? sax / sa : 0.5, ay: sa ? say / sa : 0.5, l: sl, lx: sl ? slx / sl : 0.5, ly: sl ? sly / sl : 0.5, cover: sa / (w * h) };
  }

  // ---- optical flow -----------------------------------------------------
  // Builds an in-between frame at fraction t between frames A and B.
  // Returns false if float render targets are missing (caller blends).
  flowInterpolate(A, B, t, target) {
    if (!this.floatRT) { this.mix(A, B, t, target); return false; }
    const aspect = A.w / A.h;
    let fw = Math.min(512, A.w), fh = Math.round(fw / aspect);
    const levels = [];
    for (let i = 0; i < 5 && Math.min(fw, fh) >= 24; i++) { levels.push([fw, fh]); fw = Math.round(fw / 2); fh = Math.round(fh / 2); }
    const L = levels.length;
    // Gray + gradient pyramids for both frames.
    const pyr = (src, tag) => {
      const out = [];
      let prev = src;
      for (let i = 0; i < L; i++) {
        const [w, h] = levels[i];
        const g = this.rt(`fl_${tag}_g${i}`, w, h, true);
        this.draw(this.pGray, g, { uTex: prev, uPx: [1 / w, 1 / h] });
        const d = this.rt(`fl_${tag}_d${i}`, w, h, true);
        this.draw(this.pGrad, d, { uTex: g, uPx: [1 / w, 1 / h] });
        out.push(d); prev = g;
      }
      return out;
    };
    const pa = pyr(A, 'a'), pb = pyr(B, 'b');
    let flow = null;
    for (let i = L - 1; i >= 0; i--) {
      const [w, h] = levels[i];
      let f0 = this.rt(`fl_f0_${i}`, w, h, true), f1 = this.rt(`fl_f1_${i}`, w, h, true);
      if (flow) this.draw(this.pUp, f0, { uFlow: flow }); else this.clear(f0);
      for (let it = 0; it < 3; it++) {
        this.draw(this.pLK, f1, { uGradA: pa[i], uB: pb[i], uFlow: f0, uPx: [1 / w, 1 / h] });

  async runEffects(layer, t, target) {
    const list = layer.effects.filter(f => f.enabled && EffectLib.get(f.defId)?.kind === 'shader');
    if (!list.length) return;
    let src = target, dst = engine.rt('fx_scratch');
    for (const fxi of list) {
      const def = EffectLib.get(fxi.defId);
      engine.runEffect(def, evalEffect(layer, fxi, t), src, dst, t + layer.start);
      [src, dst] = [dst, src];
    }
    if (src !== target) engine.copy(src, target);
  },

  // Renders a layer with Hold Motion applied. Returns { rt, opT }.
  async renderHeld(layer, lt, mode) {
    const E = engine, fps = this.project.fps;
    const fxi = layer.effects.find(f => f.enabled && EffectLib.get(f.defId)?.kind === 'hold');
    const out = E.rt('L_out');
    if (!fxi) { await this.renderLayer(layer, lt, lt, mode, out); return { rt: out, opT: lt }; }

    const v = evalEffect(layer, fxi, lt);
    const n = Math.floor(lt * fps + 1e-6), phase = lt - n / fps;
    const toT = (f) => f / fps + phase;
    let ghostN = 0; const ghostOp = [];
    if (v.ghosts) for (let k = 1; k <= Math.round(v.ghostCount); k++) { const o = Math.pow(1 - v.ghostFalloff, k); if (o < 1 / 512) break; ghostOp.push(o); ghostN = k; }
    const wantBlur = v.snapBlur && v.snapAmount > 0;
    const starts = holdStarts(v, n, Math.max(ghostN, wantBlur ? 1 : 0));
    if (n >= 0 && starts[0] < 0) starts[0] = 0;
    const heldT = toT(starts[0]);
    const tT = (t) => (v.includeTransform ? t : lt);

    let accA = E.rt('h_accA'), accB = E.rt('h_accB');
    E.clear(accA);
    for (let k = ghostN; k >= 1; k--) {
      if (starts[k] < 0 && n >= 0) continue;
      const g = toT(starts[k]);
      const tmp = await this.renderLayer(layer, g, tT(g), mode, E.rt('h_tmp'));
      const tint = parseColor(v.ghostTint);
      E.composite(accA, tmp, GHOST_TO_MODE[v.ghostBlend] ?? 0, ghostOp[k - 1], accB, [tint[0], tint[1], tint[2]]);
      [accA, accB] = [accB, accA];
    }

    let main = await this.renderLayer(layer, heldT, tT(heldT), mode, E.rt('h_main'));
    if (wantBlur && starts[0] === n && n > 0 && !(starts[1] < 0)) {
      const pt = toT(starts[1]);
      const prev = await this.renderLayer(layer, pt, tT(pt), mode, E.rt('h_prev'));
      const c1 = E.centroid(main), c0 = E.centroid(prev);
      let dx = 0, dy = 0;
      const useAlpha = c1.cover < 0.97 && c0.cover < 0.97 && c1.a > 0 && c0.a > 0;
      if (useAlpha) { dx = c1.ax - c0.ax; dy = c1.ay - c0.ay; }
      if (Math.hypot(dx * E.width, dy * E.height) < 0.5 && c1.l > 0 && c0.l > 0) { dx = c1.lx - c0.lx; dy = c1.ly - c0.ly; }
      const lenPx = Math.hypot(dx * E.width, dy * E.height) * v.snapAmount;
      if (lenPx >= 1) {
        const taps = clamp(Math.ceil(lenPx / 1.5) + 1, 2, 48);
        // Sample toward the new position so the streak trails behind the motion.
        E.dirBlur(main, [-dx * v.snapAmount, -dy * v.snapAmount], taps, E.rt('h_blur'));
        main = E.rt('h_blur');
      }
    }
    E.composite(accA, main, 0, 1, accB);
    [accA, accB] = [accB, accA];

    if (v.mix < 1) {
      const orig = await this.renderLayer(layer, lt, lt, mode, E.rt('h_orig'));
      E.mix(orig, accA, v.mix, out);
    } else E.copy(accA, out);
    return { rt: out, opT: tT(heldT) };
  },

  // Render the whole comp at time T. mode: 'exact' (seek every video frame,
  // used for export and when paused) or 'play' (use live video, no waiting).
  // Only one frame renders at a time, because frames share GPU buffers.
  // Playback frames are dropped instead of queued if a render is running.
  _lock: Promise.resolve(), _locked: false,
  // onDone runs while the lock is still held, so the caller can read the
  // canvas (export, tests) before any other frame draws over it.
  async frame(project, T, mode, onDone) {
    if (mode === 'play' && this._locked) return null;
    const prev = this._lock; let release;
    this._lock = new Promise(r => { release = r; });
    await prev;
    this._locked = true;
    try { const r = await this._frame(project, T, mode); if (onDone) await onDone(r); return r; }
    finally { this._locked = false; release(); }
  },
  async _frame(project, T, mode) {
    this.project = project;
    const E = engine;
    let cur = E.rt('accA'), other = E.rt('accB');
    E.clear(cur, parseColor(project.bg));
    for (const layer of project.layers) {
      if (layer.hidden || layer.type === 'audio') continue;
      if (T < layer.start - 1e-6 || T >= layer.start + layer.dur - 1e-6) continue;
      const lt = T - layer.start;
      if (layer.type === 'adjust') {
        const tmp = E.rt('adj');
        E.copy(cur, tmp);
        await this.runEffects(layer, lt, tmp);
        E.mix(cur, tmp, clamp(evalProp(layer, 'transform.opacity', lt) / 100, 0, 1), other);
        [cur, other] = [other, cur];
        continue;
      }
      const { rt, opT } = await this.renderHeld(layer, lt, mode);
      const op = clamp(evalProp(layer, 'transform.opacity', opT) / 100, 0, 1);
      E.composite(cur, rt, Math.max(0, BLEND_MODES.indexOf(layer.blend || 'Normal')), op, other);
      [cur, other] = [other, cur];
    }
    E.present(cur);
    return cur;
  }
};

const Player = {
  playing: false,
  startWall: 0, startT: 0,
  sources: [],
  raf: 0,

  async play() {
    const p = App.project; if (!p || this.playing) return;
    if (App.time >= p.duration - 1 / p.fps) App.time = 0;
    this.playing = true; App.setPreviewQuality();
    this.startT = App.time; this.startWall = performance.now();
    this.startAudio(p, App.time);
    this.syncVideos(p, App.time, true);
    const tick = async () => {
      if (!this.playing) return;
      let T = this.startT + (performance.now() - this.startWall) / 1000;
      if (T >= p.duration) {
        if (App.loop) { this.stopAudio(); this.startT = 0; this.startWall = performance.now(); T = 0; this.startAudio(p, 0); this.syncVideos(p, 0, true); }
        else { this.pause(); App.setTime(p.duration - 1 / p.fps); return; }
      }
      App.time = T;
      this.syncVideos(p, T, false);
      try { await Renderer.frame(p, T, 'play'); } catch (e) { console.warn(e); }
      UI.updatePlayhead();
      this.raf = requestAnimationFrame(tick);
    };
    UI.updateTransport();
    this.raf = requestAnimationFrame(tick);
  },

  pause() {
    if (!this.playing) return;
    this.playing = false;
    cancelAnimationFrame(this.raf);
    this.stopAudio();
    for (const r of Runtime.map.values()) if (r.video) r.video.pause();
    const p = App.project;
    if (p) App.time = Math.round(App.time * p.fps) / p.fps;
    UI.updateTransport();
    App.requestRender();
  },

  toggle() { this.playing ? this.pause() : this.play(); },

  // Keep each video element running near the time the timeline needs.
  syncVideos(p, T, force) {
    for (const layer of p.layers) {
      if (layer.type !== 'video') continue;
      const r = Runtime.get(layer); const v = r.video; if (!v) continue;
      const active = !layer.hidden && T >= layer.start && T < layer.start + layer.dur;
      if (!active) { if (!v.paused) v.pause(); continue; }
      const speed = layer.video.speed || 1;
      const src = (layer.in || 0) + (T - layer.start) * speed;
      const rate = clamp(speed, 0.0625, 16);
      if (Math.abs(v.playbackRate - rate) > 1e-3) v.playbackRate = rate;
      if (v.paused || force || Math.abs(v.currentTime - src) > 0.25) {
        v.currentTime = src;
        if (v.paused) v.play().catch(() => {});
      }
    }
  },

  startAudio(p, T) {
    const ctx = Media.getAudioCtx(); if (!ctx) return;
    if (ctx.state === 'suspended') ctx.resume();
    const now = ctx.currentTime + 0.05;
    for (const layer of p.layers) {
      const m = Media.items.get(layer.mediaId);
      if (!m || !m.audio || layer.hidden || layer.muted) continue;
      if (layer.type !== 'video' && layer.type !== 'audio') continue;
      const end = layer.start + layer.dur;
      if (end <= T) continue;
      const speed = (layer.type === 'video' ? layer.video.speed : layer.audioOpts?.speed) || 1;
      const startAt = Math.max(T, layer.start);
      const offset = (layer.in || 0) + (startAt - layer.start) * speed;
      const src = ctx.createBufferSource(); src.buffer = m.audio; src.playbackRate.value = speed;
      const g = ctx.createGain(); g.gain.value = (layer.volume ?? 100) / 100;
      src.connect(g).connect(ctx.destination);
      try { src.start(now + (startAt - T), offset, (end - startAt) * speed); this.sources.push(src); } catch (e) { }
    }
  },
  stopAudio() { for (const s of this.sources) { try { s.stop(); } catch (e) { } } this.sources = []; }
};

// ---- Export --------------------------------------------------------------
async function pickVideoCodec(W, H, fps, bitrate) {
  const list = ['avc1.640034', 'avc1.640033', 'avc1.640028', 'avc1.4d0028', 'avc1.42e01f'];
  for (const codec of list) {
    try {
      const s = await VideoEncoder.isConfigSupported({ codec, width: W, height: H, bitrate, framerate: fps });
      if (s.supported) return codec;
    } catch (e) { }
  }
  return null;
}

async function mixAudio(p) {
  const layers = p.layers.filter(l => (l.type === 'video' || l.type === 'audio') && !l.hidden && !l.muted && Media.items.get(l.mediaId)?.audio);
  if (!layers.length) return null;
  const sr = 48000, len = Math.ceil(p.duration * sr);
  const ctx = new OfflineAudioContext(2, len, sr);
  for (const layer of layers) {
    const m = Media.items.get(layer.mediaId);
    const speed = (layer.type === 'video' ? layer.video.speed : layer.audioOpts?.speed) || 1;
    const src = ctx.createBufferSource(); src.buffer = m.audio; src.playbackRate.value = speed;
    const g = ctx.createGain(); g.gain.value = (layer.volume ?? 100) / 100;
    src.connect(g).connect(ctx.destination);
    src.start(layer.start, layer.in || 0, layer.dur * speed);
  }
  return await ctx.startRendering();
}

const Exporter = {
  busy: false, cancel: false,
  async run(p, opts, onProgress) {
    if (!('VideoEncoder' in window)) throw new Error('This browser can’t encode video. Use Safari 16.4 or newer, or a current Chrome or Edge.');
    this.busy = true; this.cancel = false;
    const fps = opts.fps || p.fps;
    const even = (n) => Math.max(2, Math.round(n / 2) * 2);
    const W = even(p.width * opts.scale), H = even(p.height * opts.scale);
    const bitrate = Math.round(W * H * fps * (opts.quality === 'high' ? 0.2 : 0.1));
    const codec = await pickVideoCodec(W, H, fps, bitrate);
    if (!codec) throw new Error(`H.264 at ${W}×${H} isn’t supported on this device. Try a lower resolution.`);

    // Audio: AAC first (plays everywhere, including iPhone Photos), Opus as a fallback.
    let audioBuf = null, audioOk = false, aCodec = null;
    if (opts.audio !== false) {
      try { audioBuf = await mixAudio(p); } catch (e) { console.warn('audio mix failed', e); }
      if (audioBuf && 'AudioEncoder' in window) {
        for (const [enc, mux] of [['mp4a.40.2', 'aac'], ['opus', 'opus']]) {
          try { if ((await AudioEncoder.isConfigSupported({ codec: enc, sampleRate: 48000, numberOfChannels: 2, bitrate: 192000 })).supported) { aCodec = [enc, mux]; break; } } catch (e) { }
        }
        audioOk = !!aCodec;
      }
    }

    const target = new Mp4Muxer.ArrayBufferTarget();
    const muxer = new Mp4Muxer.Muxer({
      target,
      video: { codec: 'avc', width: W, height: H, frameRate: fps },
      audio: audioOk ? { codec: aCodec[1], numberOfChannels: 2, sampleRate: 48000 } : undefined,
      fastStart: 'in-memory',
      firstTimestampBehavior: 'offset'
    });
    let encErr = null;
    const venc = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: (e) => { encErr = e; } });
    venc.configure({ codec, width: W, height: H, bitrate, framerate: fps, avc: { format: 'avc' } });

    await Renderer._lock;
    const prevSize = [engine.width, engine.height];
    engine.setSize(W, H, p.width, p.height);
    Runtime.clearCaches();
    const N = Math.max(1, Math.round(p.duration * fps));
    try {
      for (let i = 0; i < N; i++) {
        if (this.cancel) throw new Error('Export cancelled');
        if (encErr) throw encErr;
        await Renderer.frame(p, i / fps, 'exact', () => {
          const vf = new VideoFrame(engine.canvas, { timestamp: Math.round(i * 1e6 / fps), duration: Math.round(1e6 / fps) });
          venc.encode(vf, { keyFrame: i % Math.round(fps * 2) === 0 });
          vf.close();
        });
        while (venc.encodeQueueSize > 4) await sleep(4);
        onProgress((i + 1) / N * (audioOk ? 0.95 : 1));
      }
      await venc.flush();
      if (encErr) throw encErr;

      if (audioOk && audioBuf) {
        const aenc = new AudioEncoder({ output: (c, m) => muxer.addAudioChunk(c, m), error: (e) => { encErr = e; } });
        aenc.configure({ codec: aCodec[0], sampleRate: 48000, numberOfChannels: 2, bitrate: 192000 });
        const ch0 = audioBuf.getChannelData(0), ch1 = audioBuf.numberOfChannels > 1 ? audioBuf.getChannelData(1) : ch0;
        const step = 4800;
        for (let off = 0; off < audioBuf.length; off += step) {
          const n = Math.min(step, audioBuf.length - off);
          const data = new Float32Array(n * 2);
          data.set(ch0.subarray(off, off + n), 0); data.set(ch1.subarray(off, off + n), n);
          const ad = new AudioData({ format: 'f32-planar', sampleRate: 48000, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round(off / 48000 * 1e6), data });
          aenc.encode(ad); ad.close();
          if (aenc.encodeQueueSize > 16) await sleep(2);
        }
        await aenc.flush();
        if (encErr) throw encErr;
      }
      muxer.finalize();
      onProgress(1);
      return { blob: new Blob([target.buffer], { type: 'video/mp4' }), W, H, codec, audio: audioOk, audioCodec: aCodec ? aCodec[1] : null, hadAudio: !!audioBuf };
    } finally {
      try { venc.close(); } catch (e) { }
      this.busy = false;
      engine.setSize(prevSize[0], prevSize[1], p.width, p.height);
      Runtime.clearCaches();
    }
  }
};

// Saving order: the Claude artifact host's download capability (when the
// page runs as a claude.ai artifact), then the share sheet, then a plain
// browser download (GitHub Pages and other normal hosting).
let _claudeDownloads;
async function claudeDownloads() {
  if (_claudeDownloads !== undefined) return _claudeDownloads;
  _claudeDownloads = null;
  try { if (window.claude && typeof window.claude.use === 'function') _claudeDownloads = await window.claude.use('downloads'); } catch (e) { _claudeDownloads = null; }
  return _claudeDownloads;
}
async function saveBlob(blob, name) {
  const dl = await claudeDownloads();
  if (dl) {
    try { await dl.save({ filename: name, data: blob }); return 'saved'; }
    catch (e) {
      if (e && e.code === 'declined') return 'cancelled';
      if (e && e.code === 'rate_limited') { toast('A save prompt is already open.'); return 'cancelled'; }
      if (e && e.code === 'too_large') { toast('That file is too big to save here. Try a smaller export.'); return 'cancelled'; }
    }
  }
  const file = new File([blob], name, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return 'shared'; }
    catch (e) { if (e.name === 'AbortError') return 'cancelled'; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 8000);
  return 'downloaded';
}
