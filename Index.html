let engine = null;

const PRESETS = [
  { name: 'Vertical 9:16', w: 1080, h: 1920 },
  { name: 'Wide 16:9', w: 1920, h: 1080 },
  { name: 'Square 1:1', w: 1080, h: 1080 },
  { name: 'Portrait 4:5', w: 1080, h: 1350 },
  { name: 'Cinema 2.39:1', w: 1920, h: 804 },
];

const App = {
  project: null, time: 0, sel: null, loop: true, hq: false,
  undoStack: [], redoStack: [], _lastSnap: 0, _lastSnapKey: '',
  _want: false, _busy: false, _saveTimer: 0,

  async init() {
    await Store.open();
    engine = new Engine($('#gl'));
    for (const r of await Store.all('effects')) {
      try { const d = parseEffectXML(r.value.xml, r.value.name); EffectLib.add(d); } catch (e) { console.warn(e); }
    }
    UI.init();
    UI.showHome();
  },

  // ---- projects ---------------------------------------------------------
  newProject(preset, fps = 30) {
    const p = {
      id: uid('p'), name: 'Untitled ' + new Date().toLocaleDateString(), version: 1,
      width: preset.w, height: preset.h, fps, duration: 10, bg: [0.06, 0.06, 0.08, 1],
      layers: [], created: Date.now(), modified: Date.now()
    };
    return p;
  },
  async open(p) {
    Player.pause();
    for (const id of Array.from(Runtime.map.keys())) Runtime.drop(id);
    this.project = p; this.time = 0; this.sel = null; this.undoStack = []; this.redoStack = [];
    const missing = [];
    for (const l of p.layers) {
      if (l.mediaId && !Media.items.has(l.mediaId)) {
        const rec = await Store.get('media', l.mediaId);
        if (rec) { try { const m = await Media.load(rec); Media.makeThumbs(m, () => UI.renderTimeline()); } catch (e) { missing.push(rec.name); } } else missing.push(l.name);
      }
    }
    if (missing.length) toast('Some media could not be loaded: ' + missing.join(', '), 5000);
    this.setPreviewQuality();
    UI.showEditor();
    this.requestRender();
  },
  save(now) {
    clearTimeout(this._saveTimer);
    const p = this.project; if (!p) return;
    const doSave = () => {
      p.modified = Date.now();
      try {
        const c = document.createElement('canvas'), k = 240 / Math.max(engine.canvas.width, engine.canvas.height);
        c.width = Math.max(1, Math.round(engine.canvas.width * k)); c.height = Math.max(1, Math.round(engine.canvas.height * k));
        c.getContext('2d').drawImage(engine.canvas, 0, 0, c.width, c.height); p.thumb = c.toDataURL('image/jpeg', 0.7);
      } catch (e) { }
      Store.put('projects', p.id, deepCopy(p));
    };
    if (now) doSave(); else this._saveTimer = setTimeout(doSave, 500);
  },

  // ---- editing ------------------------------------------------------------
  // Every change goes through here so undo, saving and redraws stay in step.
  // Quick repeated edits with the same key (a slider drag) share one undo step.
  change(fn, key = '') {
    const now = performance.now();
    if (!(key && key === this._lastSnapKey && now - this._lastSnap < 800)) {
      this.undoStack.push(JSON.stringify(this.project));
      if (this.undoStack.length > 80) this.undoStack.shift();
      this.redoStack = [];
    }
    this._lastSnap = now; this._lastSnapKey = key;
    fn(this.project);
    this.save();
    this.requestRender();
  },
  undo() {
    if (!this.undoStack.length) return;
    this.redoStack.push(JSON.stringify(this.project));
    this.restore(JSON.parse(this.undoStack.pop()));
  },
  redo() {
    if (!this.redoStack.length) return;
    this.undoStack.push(JSON.stringify(this.project));
    this.restore(JSON.parse(this.redoStack.pop()));
  },
  restore(p) {
    const keep = new Set(p.layers.map(l => l.id));
    for (const id of Array.from(Runtime.map.keys())) if (!keep.has(id)) Runtime.drop(id);
    for (const r of Runtime.map.values()) r.texKey = '';
    this.project = p; this._lastSnapKey = '';
    if (this.sel && !p.layers.some(l => l.id === this.sel)) this.sel = null;
    this.save(); UI.refresh(); this.requestRender();
  },

  layer(id = this.sel) { return this.project && this.project.layers.find(l => l.id === id); },
  setTime(t, fromScroll) {
    const p = this.project; if (!p) return;
    this.time = clamp(Math.round(t * p.fps) / p.fps, 0, Math.max(0, p.duration - 1 / p.fps));
    if (Player.playing) { Player.startT = this.time; Player.startWall = performance.now(); Player.stopAudio(); Player.startAudio(p, this.time); Player.syncVideos(p, this.time, true); }
    UI.updatePlayhead(fromScroll); UI.refreshPanelValues();
    this.requestRender();
  },
  setPreviewQuality() {
    const p = this.project; if (!p) return;
    const maxDim = this.hq ? 1920 : (Player.playing ? 720 : 1080);
    const k = Math.min(1, maxDim / Math.max(p.width, p.height));
    const w = Math.round(p.width * k), h = Math.round(p.height * k);
    if (w !== engine.width || h !== engine.height || engine.compW !== p.width || engine.compH !== p.height) {
      engine.setSize(w, h, p.width, p.height);
      Runtime.clearCaches();
      for (const r of Runtime.map.values()) r.texKey = '';
    }
    UI.fitStage();
  },
  // Renders the latest requested time; skips stale requests while busy.
  requestRender() {
    if (!this.project || Player.playing || Exporter.busy) return;
    this._want = true;
    if (this._busy) return;
    this._busy = true;
    (async () => {
      while (this._want && !Exporter.busy) {
        this._want = false;
        if (!Player.playing) this.setPreviewQuality();
        try { await Renderer.frame(this.project, this.time, 'exact'); } catch (e) { console.warn(e); }
      }
      this._busy = false;
    })();
  },

  // ---- layers -----------------------------------------------------------
  baseLayer(type, name) {
    const p = this.project;
    return {
      id: uid('l'), type, name, start: this.time, dur: Math.min(5, Math.max(1, p.duration - this.time)), in: 0,
      hidden: false, locked: false, blend: 'Normal', volume: 100, muted: false,
      transform: { x: p.width / 2, y: p.height / 2, scale: 100, rotation: 0, opacity: 100, anchorX: 0, anchorY: 0 },
      keys: {}, effects: []
    };
  },
  addLayer(l) {
    this.change(p => { p.layers.push(l); p.duration = Math.max(p.duration, l.start + l.dur); });
    this.sel = l.id; UI.tab = null; UI.closeSheet(true); UI.refresh();
  },
  addText() {
    const l = this.baseLayer('text', 'Text');
    l.text = { content: 'Title', font: 'Sans', size: Math.round(this.project.height * 0.07), weight: 800, italic: false, align: 'center', lineHeight: 1.15, color: [1, 1, 1, 1], strokeOn: false, stroke: [0, 0, 0, 1], strokeWidth: 6 };
    this.addLayer(l);
  },
  addShape(kind = 'rect') {
    const l = this.baseLayer('shape', kind[0].toUpperCase() + kind.slice(1));
    const s = Math.round(Math.min(this.project.width, this.project.height) * 0.35);
    l.shape = { kind, w: s, h: s, radius: 24, points: 5, inner: 0.45, fillOn: true, fill: [1, 0.36, 0.3, 1], strokeOn: false, stroke: [1, 1, 1, 1], strokeWidth: 8 };
    this.addLayer(l);
  },
  addSolid() {
    const l = this.baseLayer('solid', 'Solid');
    l.solid = { color: [0.15, 0.4, 1, 1], w: this.project.width, h: this.project.height };
    this.addLayer(l);
  },
  addAdjust() {
    const l = this.baseLayer('adjust', 'Adjustment');
    this.addLayer(l);
  },
  async addMediaFiles(files) {
    let added = 0;
    for (const f of files) {
      UI.busy(`Loading ${f.name}…`);
      try {
        const m = await Media.importFile(f);
        const p = this.project;
        const l = this.baseLayer(m.type, m.name.replace(/\.[^.]+$/, ''));
        l.mediaId = m.id;
        if (m.type === 'video' || m.type === 'image') {
          l.transform.scale = Math.round(Math.min(p.width / m.w, p.height / m.h) * 1000) / 10;
        }
        if (m.type === 'video') {
          l.dur = m.duration;
          l.video = { speed: 1, interp: 'none', srcFps: 30 };
          const fps = await withTimeout(detectFps(m), 2500, null);
          if (fps) l.video.srcFps = fps;
        }
        if (m.type === 'audio') { l.dur = m.duration; l.audioOpts = { speed: 1 }; }
        // Videos and photos line up one after another, like a main track.
        if (m.type !== 'audio') {
          const ends = p.layers.filter(x => x.type === 'video' || x.type === 'image').map(x => x.start + x.dur);
          if (ends.length) l.start = Math.round(Math.max(...ends) * p.fps) / p.fps;
        }
        if (m.type === 'image') l.dur = 3;
        this.addLayer(l);
        added++;
        const r = Runtime.get(l);
        if (r.video) { r.video.play().then(() => r.video.pause()).catch(() => {}); }
        Media.makeThumbs(m, () => UI.renderTimeline());
        if (m.audioReady) m.audioReady.then(() => { if (m.audioSkipped) toast(`${m.name} is very large, so its sound wasn’t loaded. Trim it shorter to keep the sound.`, 5000); });
      } catch (e) { UI.busy(null); UI.modal('Couldn’t add that file', el('p', {}, e.message || String(e)), [['OK', () => UI.closeModal()]]); }
    }
    UI.busy(null);
    if (added) { this.time = Math.max(0, this.layer()?.start || 0); UI.refresh(); UI.updatePlayhead(); }
    this.requestRender();
  },
  // Copies a layer with fresh ids (effect ids appear in keyframe paths too).
  cloneLayer(l) {
    const c = deepCopy(l); c.id = uid('l');
    const map = {};
    for (const f of c.effects) { const n = uid('fx'); map[f.uid] = n; f.uid = n; }
    const keys = {};
    for (const [path, ks] of Object.entries(c.keys || {})) {
      const parts = path.split('.');
      if (parts[0] === 'fx' && map[parts[1]]) parts[1] = map[parts[1]];
      keys[parts.join('.')] = ks;
    }
    c.keys = keys;
    return c;
  },
  duplicate() {
    const l = this.layer(); if (!l) return;
    const c = this.cloneLayer(l); c.name = l.name + ' copy';
    this.change(p => { p.layers.splice(p.layers.indexOf(l) + 1, 0, c); });
    this.sel = c.id; UI.refresh();
  },
  split() {
    const l = this.layer(); if (!l) return;
    const T = this.time, cut = T - l.start;
    if (cut <= 0.01 || cut >= l.dur - 0.01) { toast('Move the playhead inside the clip to split it.'); return; }
    const b = this.cloneLayer(l);
    const speed = (l.video && l.video.speed) || (l.audioOpts && l.audioOpts.speed) || 1;
    b.start = T; b.in = (l.in || 0) + cut * speed; b.dur = l.dur - cut;
    for (const ks of Object.values(b.keys)) for (const k of ks) k.t -= cut;
    this.change(p => {
      const a = p.layers.find(x => x.id === l.id); a.dur = cut;
      p.layers.splice(p.layers.indexOf(a) + 1, 0, b);
    });
    this.sel = b.id; UI.refresh();
  },
  remove() {
    const l = this.layer(); if (!l) return;
    this.change(p => { p.layers = p.layers.filter(x => x.id !== l.id); });
    Runtime.drop(l.id); this.sel = null; UI.closeSheet(true); UI.refresh();
  },
  move(dir) {
    const l = this.layer(); if (!l) return;
    this.change(p => {
      const i = p.layers.indexOf(l), j = clamp(i + dir, 0, p.layers.length - 1);
      p.layers.splice(i, 1); p.layers.splice(j, 0, l);
    });
    UI.refresh();
  },

  // ---- properties and keyframes ---------------------------------------------
  keysOf(l, path) { return (l.keys && l.keys[path]) || []; },
  keyAt(l, path, t = this.time - l.start) {
    const half = 0.5 / this.project.fps;
    return this.keysOf(l, path).find(k => Math.abs(k.t - t) < half) || null;
  },
  setProp(l, path, v, key) {
    this.change(() => {
      const ks = this.keysOf(l, path);
      if (ks.length) {
        const t = Math.round((this.time - l.start) * this.project.fps) / this.project.fps;
        const k = this.keyAt(l, path, t);
        if (k) k.v = v; else { ks.push({ t, v, e: 'ease' }); ks.sort((a, b) => a.t - b.t); }
      } else setPath(l, path, v);
    }, key || ('p:' + l.id + path));
  },
  toggleKey(l, path) {
    this.change(() => {
      l.keys = l.keys || {};
      const t = Math.round((this.time - l.start) * this.project.fps) / this.project.fps;
      const ks = l.keys[path] || (l.keys[path] = []);
      const k = this.keyAt(l, path, t);
      if (k) {
        ks.splice(ks.indexOf(k), 1);
        if (!ks.length) { delete l.keys[path]; }
      } else {
        const v = deepCopy(evalProp(l, path, t));
        if (!ks.length) setPath(l, path, deepCopy(v));
        ks.push({ t, v, e: 'ease' }); ks.sort((a, b) => a.t - b.t);
      }
    });
    UI.refreshPanel(); UI.renderTimeline();
  },
  clearKeys(l, path) {
    this.change(() => { const v = evalProp(l, path, this.time - l.start); delete l.keys[path]; setPath(l, path, deepCopy(v)); });
    UI.refreshPanel(); UI.renderTimeline();
  },

  addEffect(defId) {
    const l = this.layer(); const def = EffectLib.get(defId);
    if (!l || !def) return;
    if (def.kind === 'hold') {
      if (l.type === 'adjust' || l.type === 'audio') { toast('Hold Motion works on visual layers, not adjustment or audio layers.'); return; }
      if (l.effects.some(f => EffectLib.get(f.defId)?.kind === 'hold')) { toast('This layer already has Hold Motion.'); return; }
    }
    const fxi = { uid: uid('fx'), defId, enabled: true, params: defaultParams(def), open: true };
    this.change(() => { l.effects.push(fxi); });
    UI.openTool('effects');
  }
};

// Best guess at a video's frame rate from frame callbacks, else 30.
async function detectFps(m) {
  try {
    const v = document.createElement('video');
    if (!v.requestVideoFrameCallback) return null;
    v.muted = true; v.playsInline = true; v.src = m.url;
    $('#videoPool').appendChild(v);
    const played = await withTimeout(v.play().then(() => true, () => false), 2000, false);
    if (!played) { v.remove(); return null; }
    const times = [];
    await new Promise((res) => {
      const cb = (now, meta) => { times.push(meta.mediaTime); if (times.length < 12) v.requestVideoFrameCallback(cb); else res(); };
      v.requestVideoFrameCallback(cb); setTimeout(res, 1500);
    });
    v.pause(); v.remove();
    const d = [];
    for (let i = 1; i < times.length; i++) { const x = times[i] - times[i - 1]; if (x > 0.001 && x < 0.2) d.push(x); }
    if (d.length < 3) return null;
    d.sort((a, b) => a - b);
    const fps = 1 / d[0];
    const common = [23.976, 24, 25, 29.97, 30, 48, 50, 59.94, 60, 120, 240];
    let best = 30, err = 1e9;
    for (const c of common) { const e = Math.abs(c - fps); if (e < err) { err = e; best = c; } }
    return best;
  } catch (e) { return null; }
}

  // ---- stage gestures: drag to move, pinch to scale and rotate ------------
  initStageGestures() {
    const c = $('#gl'); const pts = new Map(); let start = null;
    const compPerPx = () => App.project.width / c.getBoundingClientRect().width;
    c.addEventListener('pointerdown', (e) => {
      const l = App.layer(); if (!l || l.locked || l.type === 'adjust' || l.type === 'audio') return;
      c.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      const lt = App.time - l.start, tr = evalTransform(l, lt);
      start = { tr, pts: new Map(Array.from(pts.entries()).map(([k, v]) => [k, { ...v }])) };
    });
    c.addEventListener('pointermove', (e) => {
      if (!pts.has(e.pointerId) || !start) return;
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      const l = App.layer(); if (!l) return;
      const ids = Array.from(pts.keys());
      if (ids.length === 1) {
        const p0 = start.pts.get(ids[0]); if (!p0) return;
        const k = compPerPx(), p1 = pts.get(ids[0]);
        App.setProp(l, 'transform.x', Math.round(start.tr.x + (p1.x - p0.x) * k), 'drag' + l.id);
        App.setProp(l, 'transform.y', Math.round(start.tr.y + (p1.y - p0.y) * k), 'drag' + l.id);
      } else if (ids.length >= 2) {
        const a0 = start.pts.get(ids[0]), b0 = start.pts.get(ids[1]), a1 = pts.get(ids[0]), b1 = pts.get(ids[1]);
        if (!a0 || !b0) { start.pts = new Map(Array.from(pts.entries()).map(([k, v]) => [k, { ...v }])); start.tr = evalTransform(l, App.time - l.start); return; }
        const d0 = Math.hypot(b0.x - a0.x, b0.y - a0.y), d1 = Math.hypot(b1.x - a1.x, b1.y - a1.y);
        const r0 = Math.atan2(b0.y - a0.y, b0.x - a0.x), r1 = Math.atan2(b1.y - a1.y, b1.x - a1.x);
        App.setProp(l, 'transform.scale', Math.round(start.tr.scale * d1 / Math.max(1, d0) * 10) / 10, 'pinch' + l.id);
        App.setProp(l, 'transform.rotation', Math.round((start.tr.rotation + (r1 - r0) * 180 / Math.PI) * 10) / 10, 'pinch' + l.id);
      }
      UI.refreshPanelValues();
    });
    const end = (e) => { pts.delete(e.pointerId); if (!pts.size) start = null; else { const l = App.layer(); if (l) start = { tr: evalTransform(l, App.time - l.start), pts: new Map(Array.from(pts.entries()).map(([k, v]) => [k, { ...v }])) }; } };
    c.addEventListener('pointerup', end); c.addEventListener('pointercancel', end);
  },

  // ---- timeline ------------------------------------------------------------
  initTimelineGestures() {
    const sc = $('#tlScroll');
    // Swiping the timeline scrubs.
    sc.addEventListener('scroll', () => {
      if (this._progTarget != null && Math.abs(sc.scrollLeft - this._progTarget) < 1) return;
      this._progTarget = null;
      if (Player.playing) Player.pause();
      App.setTime(sc.scrollLeft / this.pps, true);
    }, { passive: true });
    // Pinch with two fingers to zoom; Ctrl + wheel on a computer.
    let pinch = null;
    sc.addEventListener('touchstart', (e) => { if (e.touches.length === 2) pinch = { d: Math.abs(e.touches[0].clientX - e.touches[1].clientX) || 1, pps: this.pps }; }, { passive: true });
    sc.addEventListener('touchmove', (e) => {
      if (!pinch || e.touches.length !== 2) return;
      e.preventDefault();
      const d = Math.abs(e.touches[0].clientX - e.touches[1].clientX) || 1;
      this.setZoom(pinch.pps * d / pinch.d);
    }, { passive: false });
    sc.addEventListener('touchend', () => { pinch = null; });
    sc.addEventListener('wheel', (e) => { if (e.ctrlKey || e.metaKey) { e.preventDefault(); this.setZoom(this.pps * (e.deltaY < 0 ? 1.15 : 1 / 1.15)); } }, { passive: false });
    $('#tracks').addEventListener('click', (e) => { if (e.target.closest('.clip')) return; if (App.sel) { App.sel = null; this.closeSheet(true); UI.refresh(); } });
  },
  setZoom(pps) { this.pps = clamp(pps, 10, 800); this.renderTimeline(); this.updatePlayhead(); },
  zoom(f) { this.setZoom(this.pps * f); },
  renderTimeline() {
    const p = App.project; if (!p) return;
    const sc = $('#tlScroll'), inner = $('#tlInner'), tracks = $('#tracks'), ruler = $('#ruler');
    const pad = this.pad = Math.round(sc.clientWidth / 2);
    inner.style.width = (pad * 2 + p.duration * this.pps) + 'px';
    ruler.innerHTML = '';
    const stepOpts = [1 / p.fps, 0.1, 0.25, 0.5, 1, 2, 5, 10, 30, 60, 120];
    const step = stepOpts.find(s => s * this.pps >= 64) || 120;
    for (let t = 0; t <= p.duration + 1e-6; t += step) {
      const lab = step >= 1 ? `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(Math.round(t % 60)).padStart(2, '0')}` : (Math.abs(t - Math.round(t)) < 1e-6 ? `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(Math.round(t % 60)).padStart(2, '0')}` : `${Math.round((t % 1) * p.fps)}f`);
      ruler.appendChild(el('div', { class: 'tick', style: { left: pad + t * this.pps + 'px' } }, lab));
      ruler.appendChild(el('div', { class: 'dot', style: { left: pad + (t + step / 2) * this.pps + 'px' } }));
    }
    tracks.innerHTML = '';
    const layers = p.layers.slice().reverse();
    for (const l of layers) tracks.appendChild(this.clipRow(l));
    if (!layers.length) tracks.appendChild(el('div', { class: 'tlempty', style: { marginLeft: pad + 'px' } }, 'Tap + to add videos or photos'));
    const add = $('#tlAdd'); if (add) add.style.display = layers.length ? '' : 'grid';
  },
  clipRow(l) {
    const p = App.project, sel = l.id === App.sel, pad = this.pad;
    const big = l.type === 'video' || l.type === 'image';
    const row = el('div', { class: 'track' + (big ? ' big' : '') });
    const m = l.mediaId ? Media.items.get(l.mediaId) : null;
    const hasHold = l.effects.some(f => f.enabled && EffectLib.get(f.defId)?.kind === 'hold');
    const nFx = l.effects.filter(f => f.enabled).length;
    const clip = el('div', {
      class: `clip t-${l.type}${sel ? ' sel' : ''}${l.hidden ? ' off' : ''}`,
      style: { left: pad + l.start * this.pps + 'px', width: Math.max(6, l.dur * this.pps) + 'px' }
    });
    // Filmstrip for video and photo clips
    if (big && m && m.thumbs && m.thumbs.length) {
      const h = 52, tw = Math.max(20, Math.round(h * m.w / m.h));
      const n = Math.min(80, Math.ceil(l.dur * this.pps / tw));
      const speed = (l.video && l.video.speed) || 1;
      const strip = el('div', { class: 'strip' });
      for (let i = 0; i < n; i++) {
        const st = (l.in || 0) + ((i + 0.5) * tw / this.pps) * speed;
        let best = m.thumbs[0];
        for (const th of m.thumbs) if (Math.abs(th.t - st) < Math.abs(best.t - st)) best = th;
        strip.appendChild(el('img', { src: best.url, style: { width: tw + 'px' }, draggable: 'false' }));
      }
      clip.appendChild(strip);
    }
    const icon = { text: 'T', shape: '◆', solid: '■', adjust: '◐', audio: '♪', video: '', image: '' }[l.type];
    const label = l.type === 'text' ? (l.text?.content || '').split('\n')[0] : l.name;
    clip.appendChild(el('span', { class: 'cname' }, icon ? el('i', {}, icon) : null, big ? null : label));
    const badges = el('span', { class: 'badges' },
      big ? el('em', {}, this.fmtLen(l.dur)) : null,
      hasHold ? el('em', { class: 'hold' }, 'HOLD') : null,
      nFx - (hasHold ? 1 : 0) > 0 ? el('em', {}, 'FX ' + (nFx - (hasHold ? 1 : 0))) : null,
      l.video && l.video.speed !== 1 ? el('em', {}, l.video.speed + '×') : null);
    clip.appendChild(badges);
    if (sel) {
      clip.append(el('div', { class: 'handle left' }), el('div', { class: 'handle right' }));
      const times = new Set(); for (const ks of Object.values(l.keys || {})) for (const k of ks) times.add(k.t.toFixed(4));
      for (const t of times) clip.appendChild(el('i', { class: 'kmark', style: { left: (+t) * this.pps + 'px' } }));
    }
    row.appendChild(clip);
    let drag = null;
    clip.addEventListener('pointerdown', (e) => {
      if (!sel) return;
      e.stopPropagation();
      clip.setPointerCapture(e.pointerId);
      const mode = e.target.classList.contains('left') ? 'left' : e.target.classList.contains('right') ? 'right' : 'move';
      drag = { mode, x: e.clientX, start: l.start, dur: l.dur, in: l.in || 0, moved: false };
    });
    clip.addEventListener('pointermove', (e) => {
      if (!drag) return;
      const dt = (e.clientX - drag.x) / this.pps; if (Math.abs(e.clientX - drag.x) > 4) drag.moved = true;
      if (!drag.moved) return;
      const snap = (t) => Math.round(t * p.fps) / p.fps;
      const speed = (l.video && l.video.speed) || (l.audioOpts && l.audioOpts.speed) || 1;
      const srcLen = m && (l.type === 'video' || l.type === 'audio') ? m.duration : Infinity;
      App.change(() => {
        if (drag.mode === 'move') l.start = Math.max(0, snap(drag.start + dt));
        else if (drag.mode === 'right') {
          l.dur = Math.max(1 / p.fps, snap(drag.dur + dt));
          if (srcLen < Infinity) l.dur = Math.min(l.dur, (srcLen - l.in) / speed);
        } else {
          let d = snap(dt); d = Math.max(d, -drag.start); d = Math.min(d, drag.dur - 1 / p.fps);
          if (srcLen < Infinity) d = Math.max(d, -drag.in / speed);
          l.start = drag.start + d; l.dur = drag.dur - d; l.in = drag.in + d * speed;
          for (const ks of Object.values(l.keys || {})) for (const k of ks) { if (k._t0 == null) k._t0 = k.t; k.t = k._t0 - d; }
        }
        p.duration = Math.max(p.duration, l.start + l.dur);
      }, 'clip' + l.id + drag.mode);
      clip.style.left = pad + l.start * this.pps + 'px'; clip.style.width = Math.max(6, l.dur * this.pps) + 'px';
    });
    const up = () => {
      if (drag && drag.moved) { for (const ks of Object.values(l.keys || {})) for (const k of ks) delete k._t0; this.renderTimeline(); this.refreshPanel(); }
      drag = null;
    };
    clip.addEventListener('pointerup', up); clip.addEventListener('pointercancel', up);
    clip.addEventListener('click', (e) => { e.stopPropagation(); if (!sel) { App.sel = l.id; this.tab = null; this.closeSheet(true); UI.refresh(); } });
    return row;
  },

    const m = Media.items.get(l.mediaId);
    const v = l.video;
    const speedRow = el('label', { class: 'row' }, el('span', {}, 'Speed'),
      el('input', {
        type: 'number', min: 0.05, max: 16, step: 0.05, value: v.speed, onchange: (e) => {
          const ns = clamp(+e.target.value || 1, 0.05, 16);
          App.change(() => {
            const old = v.speed || 1; v.speed = ns;
            l.dur = Math.max(1 / App.project.fps, l.dur * old / ns);
            if (m) l.dur = Math.min(l.dur, (m.duration - (l.in || 0)) / ns);
            App.project.duration = Math.max(App.project.duration, l.start + l.dur);
          });
          UI.refresh();
        }
      }));
    const presets = el('div', { class: 'btnrow' }, [0.1, 0.25, 0.5, 1, 2, 4].map(s => el('button', {
      class: 'btn' + (Math.abs(v.speed - s) < 1e-6 ? ' on' : ''), onclick: () => { speedRow.querySelector('input').value = s; speedRow.querySelector('input').dispatchEvent(new Event('change')); }
    }, s + '×')));
    const interp = el('label', { class: 'row' }, el('span', {}, 'Slow-mo frames'),
      el('select', { onchange: (e) => { App.change(() => { v.interp = e.target.value; }); } },
        [['none', 'Off (repeat frames)'], ['blend', 'Frame blend'], ['flow', 'Optical flow (smooth)']].map(([val, n]) => el('option', { value: val, selected: v.interp === val }, n))));
    const fps = el('label', { class: 'row' }, el('span', {}, 'Source frame rate'),
      el('input', { type: 'number', min: 1, max: 960, step: 0.001, value: v.srcFps, onchange: (e) => { App.change(() => { v.srcFps = clamp(+e.target.value || 30, 1, 960); }); Runtime.clearCaches(); } }));
    body.append(...[speedRow, presets, interp, fps,
      el('p', { class: 'hint' }, 'Optical flow builds new in-between frames from the motion between real frames, for smooth slow motion from normal footage. It shows in the paused preview and in the export. During playback the preview repeats frames to stay real time.'),
      engine.floatRT ? null : el('p', { class: 'warn' }, 'This device’s GPU lacks float render targets, so Optical flow falls back to Frame blend.')].filter(Boolean));
  },
  panel_audio(body, l) {
    const m = Media.items.get(l.mediaId);
    if (!m || !m.audio) { body.append(el('p', { class: 'hint' }, 'This clip has no audio the browser can read.')); return; }
    body.append(
      el('label', { class: 'row' }, el('span', {}, 'Volume %'), el('input', { type: 'range', min: 0, max: 200, value: l.volume ?? 100, oninput: (e) => App.change(() => { l.volume = +e.target.value; }, 'vol' + l.id) })),
      el('label', { class: 'row' }, el('span', {}, 'Mute'), el('input', { type: 'checkbox', class: 'tog', checked: !!l.muted, onchange: (e) => App.change(() => { l.muted = e.target.checked; }) })));
  },
  panel_blend(body, l) {
    body.append(el('label', { class: 'row' }, el('span', {}, 'Blend mode'),
      el('select', { onchange: (e) => App.change(() => { l.blend = e.target.value; }) }, BLEND_MODES.map(b => el('option', { value: b, selected: (l.blend || 'Normal') === b }, b)))));
  },
  panel_layer(body, l) {
    body.append(
      el('label', { class: 'row' }, el('span', {}, 'Name'), el('input', { type: 'text', value: l.name, onchange: (e) => { App.change(() => { l.name = e.target.value || l.name; }); UI.refresh(); } })),
      el('div', { class: 'tools' },
        el('button', { class: 'tool', onclick: () => App.split() }, el('span', {}, 'Split at playhead')),
        el('button', { class: 'tool', onclick: () => App.duplicate() }, el('span', {}, 'Duplicate')),
        el('button', { class: 'tool', onclick: () => App.move(1) }, el('span', {}, 'Bring forward')),
        el('button', { class: 'tool', onclick: () => App.move(-1) }, el('span', {}, 'Send backward')),
        el('button', { class: 'tool', onclick: () => { App.change(() => { l.hidden = !l.hidden; }); UI.refresh(); } }, el('span', {}, l.hidden ? 'Show layer' : 'Hide layer')),
        el('button', { class: 'tool danger', onclick: () => App.remove() }, el('span', {}, 'Delete layer'))),
      el('p', { class: 'hint' }, `Starts at ${fmtTime(l.start, App.project.fps)}, lasts ${l.dur.toFixed(2)} s.`));
  },

  panel_effects(body, l) {
    body.appendChild(el('button', { class: 'btn primary wide', onclick: () => this.effectBrowser() }, '+ Add effect'));
    if (!l.effects.length) body.appendChild(el('p', { class: 'hint' }, l.type === 'adjust' ? 'Effects on an adjustment layer change every layer below it.' : 'Effects run top to bottom. Hold Motion always applies to the whole layer.'));
    l.effects.forEach((fxi, idx) => {
      const def = EffectLib.get(fxi.defId);
      const card = el('div', { class: 'fxcard' + (fxi.enabled ? '' : ' off') });
      const head = el('div', { class: 'fxhead' },
        el('input', { type: 'checkbox', class: 'tog sm', checked: fxi.enabled, title: 'On/off', onchange: (e) => { App.change(() => { fxi.enabled = e.target.checked; }); card.classList.toggle('off', !fxi.enabled); UI.renderTimeline(); } }),
        el('b', { onclick: () => { fxi.open = !fxi.open; App.save(); this.refreshPanel(); } }, def ? def.name : 'Missing effect'),
        btn('up', 'Move up', () => { if (idx > 0) { App.change(() => { l.effects.splice(idx - 1, 0, l.effects.splice(idx, 1)[0]); }); this.refreshPanel(); } }, 'ghost'),
        btn('down', 'Move down', () => { if (idx < l.effects.length - 1) { App.change(() => { l.effects.splice(idx + 1, 0, l.effects.splice(idx, 1)[0]); }); this.refreshPanel(); } }, 'ghost'),
        btn('trash', 'Remove effect', () => { App.change(() => { l.effects.splice(idx, 1); for (const k of Object.keys(l.keys)) if (k.startsWith('fx.' + fxi.uid + '.')) delete l.keys[k]; }); this.refreshPanel(); this.renderTimeline(); }, 'ghost'));
      card.appendChild(head);
      if (!def) { card.appendChild(el('p', { class: 'warn' }, `The effect “${fxi.defId}” isn’t installed. Import its XML file to restore it.`)); body.appendChild(card); return; }
      const err = def.kind === 'shader' ? (engine.effectProgram(def), engine.effectError(def)) : null;
      if (err) card.appendChild(el('p', { class: 'warn' }, 'This effect’s shader failed to compile: ' + err.split('\n')[0]));
      if (fxi.open) {
        for (const p of def.params) {
          if (p.kind === 'texture') continue;
          if (p.kind === 'section') { if (p.label && !/GOLD MOTION/i.test(p.label)) card.appendChild(el('div', { class: 'sect' }, p.label)); continue; }
          const path = `fx.${fxi.uid}.${p.id}`;
          if (fxi.params[p.id] === undefined) fxi.params[p.id] = deepCopy(p.default);
          if (p.kind === 'spinner') {
            const span = p.max - p.min;
            card.appendChild(this.propRow(l, path, p.label, { min: p.min - span * 10, max: p.max + span * 10, smin: p.min, smax: p.max, step: p.step || 0.01 }));
          } else if (p.kind === 'color') card.appendChild(this.propRow(l, path, p.label, { type: 'color' }));
          else if (p.kind === 'switch') card.appendChild(this.propRow(l, path, p.label, { type: 'bool' }));
          else if (p.kind === 'selector') card.appendChild(this.propRow(l, path, p.label, { type: 'select', choices: p.choices }));
        }
        if (def.desc) card.appendChild(el('p', { class: 'hint' }, def.desc));
      }
      body.appendChild(card);
    });
  },

  // ---- effects browser and import -------------------------------------------
  effectBrowser() {
    let cat = 'All', q = '';
    const grid = el('div', { class: 'fxgrid' });
    const cats = el('div', { class: 'chips' });
    const search = el('input', { type: 'search', placeholder: 'Search effects', oninput: (e) => { q = e.target.value.toLowerCase(); draw(); } });
    const draw = () => {
      cats.innerHTML = '';
      for (const c of ['All', ...EffectLib.categories()]) cats.appendChild(el('button', { class: 'chip' + (c === cat ? ' on' : ''), onclick: () => { cat = c; draw(); } }, c));
      grid.innerHTML = '';
      const list = EffectLib.list().filter(d => (cat === 'All' || d.category === cat) && (!q || (d.name + ' ' + d.tags + ' ' + d.desc).toLowerCase().includes(q)));
      for (const d of list) grid.appendChild(el('button', { class: 'fxitem', onclick: () => { this.closeModal(); App.addEffect(d.id); } },
        el('b', {}, d.name), el('small', {}, d.category + (d.builtin ? '' : ' · imported')), el('span', {}, d.desc || '')));
      if (!list.length) grid.appendChild(el('p', { class: 'empty' }, 'Nothing matches.'));
    };
    draw();
    const body = el('div', { class: 'fxbrowser' }, search, cats, grid);
    this.modal('Add effect', body, [['Import XML or ZIP', () => $('#fileFx').click()], ['Close', () => this.closeModal()]], 'big');
  },
  async importEffects(files) {
    let ok = 0; const errs = [];
    const take = async (name, text) => {
      try {
        const d = parseEffectXML(text, name);
        EffectLib.add(d);
        await Store.put('effects', d.id, { name, xml: text });
        const p = engine.effectProgram(d);
        if (!p) errs.push(`${d.name}: shader error`);
        ok++;
      } catch (e) { errs.push(e.message); }
    };
    this.busy('Importing effects…');
    for (const f of files) {
      if (/\.zip$/i.test(f.name) || f.type === 'application/zip') {
        try { for (const z of await readZip(f)) if (/\.xml$/i.test(z.name) && !z.name.includes('__MACOSX')) await take(z.name.split('/').pop(), await z.text()); }
        catch (e) { errs.push(`${f.name}: ${e.message}`); }
      } else await take(f.name, await f.text());
    }
    this.busy(null);
    toast(`Imported ${ok} effect${ok === 1 ? '' : 's'}${errs.length ? `, ${errs.length} with problems` : ''}.`, 4000);
    if (errs.length) console.warn(errs);
    if ($('#modal .fxbrowser')) this.effectBrowser();
    if (!$('#home').classList.contains('hidden')) $('#fxCount').textContent = `${EffectLib.list().length} effects installed`;
    if (App.project) this.refreshPanel();
    return { ok, errs };
  },
  effectLibrary() {
    const list = el('div', { class: 'liblist' });
    const draw = () => {
      list.innerHTML = '';
      const custom = EffectLib.list().filter(d => !d.builtin);
      list.appendChild(el('p', { class: 'hint' }, `${EffectLib.list().length - custom.length} built-in effects, ${custom.length} imported. Import works with single .xml effect files or a .zip of them, in the Gold Motion / Alight Motion custom effect format.`));
      for (const d of custom) list.appendChild(el('div', { class: 'librow' }, el('span', {}, d.name, el('small', {}, ' ' + d.category)),
        btn('trash', 'Remove', async () => { await Store.del('effects', d.id); EffectLib.defs.delete(d.id); EffectLib.order = EffectLib.order.filter(x => x !== d.id); draw(); $('#fxCount').textContent = `${EffectLib.list().length} effects installed`; }, 'ghost')));
    };
    draw();
    this.modal('Effect library', list, [['Import XML or ZIP', () => $('#fileFx').click()], ['Done', () => this.closeModal()]]);
  },

  // ---- export ---------------------------------------------------------------
  exportDialog() {
    const p = App.project; Player.pause();
    let scale = 1, fps = p.fps, quality = 'high', audio = true;
    const resRow = el('div', { class: 'btnrow' }, [[0.5, 'Half'], [1, 'Full'], [2, '2× larger']].map(([s, n]) => el('button', {
      class: 'btn' + (s === 1 ? ' on' : ''), onclick: (e) => { scale = s; $$('.btn', resRow).forEach(b => b.classList.remove('on')); e.currentTarget.classList.add('on'); info(); }
    }, n)));
    const infoEl = el('p', { class: 'hint' });
    const info = () => { infoEl.textContent = `${Math.round(p.width * scale / 2) * 2}×${Math.round(p.height * scale / 2) * 2}, ${fps} fps, ${p.duration.toFixed(2)} s, H.264 MP4. “2× larger” renders text, shapes and effects at double size, and enlarges footage.`; };
    info();
    const body = el('div', {},
      el('div', { class: 'sect' }, 'Resolution'), resRow,
      el('label', { class: 'row' }, el('span', {}, 'Frame rate'), el('select', { onchange: (e) => { fps = +e.target.value; info(); } }, [...new Set([p.fps, 24, 25, 30, 60])].map(f => el('option', { value: f, selected: f === p.fps }, f + ' fps')))),
      el('label', { class: 'row' }, el('span', {}, 'Quality'), el('select', { onchange: (e) => quality = e.target.value }, el('option', { value: 'high' }, 'High'), el('option', { value: 'standard' }, 'Standard (smaller file)'))),
      el('label', { class: 'row' }, el('span', {}, 'Include audio'), el('input', { type: 'checkbox', class: 'tog', checked: true, onchange: (e) => audio = e.target.checked })),
      infoEl);
    this.modal('Export video', body, [['Cancel', () => this.closeModal()], ['Export', () => this.runExport({ scale, fps, quality, audio }), 'primary']]);
  },
  async runExport(opts) {
    const p = App.project;
    const bar = el('div', { class: 'bar' }, el('i')); const label = el('p', { class: 'hint' }, 'Starting…');
    const t0 = performance.now();
    this.modal('Exporting', el('div', {}, bar, label), [['Cancel', () => { Exporter.cancel = true; }]]);
    try {
      const res = await Exporter.run(p, opts, (f) => {
        bar.firstChild.style.width = (f * 100).toFixed(1) + '%';
        const el2 = (performance.now() - t0) / 1000, left = f > 0.02 ? el2 / f - el2 : 0;
        label.textContent = `${Math.round(f * 100)}%${left ? ` · about ${Math.ceil(left)} s left` : ''}`;
      });
      const name = (p.name || 'TwoFrame').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '_') + '.mp4';
      const url = URL.createObjectURL(res.blob);
      const mb = (res.blob.size / 1048576).toFixed(1);
      const body = el('div', {},
        el('video', { src: url, controls: true, playsinline: true, class: 'result' }),
        el('p', { class: 'hint' }, `${res.W}×${res.H}, ${mb} MB, H.264${res.audio ? ' with ' + (res.audioCodec === 'aac' ? 'AAC' : 'Opus') + ' audio' : ''}.${res.hadAudio && !res.audio ? ' Audio was skipped because this browser can’t encode audio.' : ''}${res.audioCodec === 'opus' ? ' Opus audio plays in browsers and VLC but some phone galleries don’t support it.' : ''}`));
      this.modal('Export finished', body, [['Close', () => { URL.revokeObjectURL(url); this.closeModal(); }], ['Save video', async () => { const r = await saveBlob(res.blob, name); if (r === 'downloaded') toast('Saved to your downloads.'); else if (r === 'saved') toast('Saved.'); }, 'primary']]);
      UI._lastExport = res;
    } catch (e) {
      this.modal('Export stopped', el('p', {}, e.message || String(e)), [['OK', () => this.closeModal()]]);
    }
    App.requestRender();
  },

  // ---- modal -------------------------------------------------------------
  modal(title, body, actions = [], cls = '') {
    const m = $('#modal'); m.innerHTML = ''; m.className = cls;
    const box = el('div', { class: 'mbox' }, el('h3', {}, title), el('div', { class: 'mbody' }, body),
      el('div', { class: 'mact' }, actions.map(([n, fn, c]) => el('button', { class: 'btn ' + (c || ''), onclick: fn }, n))));
    m.appendChild(box);
    m.onclick = (e) => { if (e.target === m && !Exporter.busy) this.closeModal(); };
  },
  closeModal() { const m = $('#modal'); m.className = 'hidden'; m.innerHTML = ''; }
};


window.addEventListener('DOMContentLoaded', () => {
  App.init().catch((e) => {
    document.body.innerHTML = '<div style="padding:30px;font:16px system-ui;color:#eee"><h2>TwoFrame can’t start here</h2><p>' + (e && e.message ? e.message : e) + '</p><p>It needs a browser with WebGL2, such as Safari 15+ or a current Chrome or Edge.</p></div>';
  });
});

</script>
</body>
</html>
